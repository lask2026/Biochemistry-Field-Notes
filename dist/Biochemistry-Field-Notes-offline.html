lpha carbon attached to an amino group, a carboxyl group, hydrogen and a side chain. Side-chain chemistry changes polarity, charge and packing.","focus":["part-0"]},{"text":"At near-neutral pH, free amino acids usually have ammonium and carboxylate groups. Aspartate and glutamate tend to be negative; lysine and arginine tend to be positive. Histidine protonation depends strongly on its environment.","focus":["part-1"]},{"text":"Glycine has two hydrogens at its alpha carbon and is achiral. Protein amino acids are predominantly L; L does not mean that every alpha center has an S configuration.","focus":["part-2"]},{"text":"Two cysteine side chains can form a covalent disulfide on oxidation. Methionine contains sulfur but does not form the same disulfide cross-link.","focus":["part-3"]}],"coreRule":{"title":"1.1 · Organize: Backbone","paragraphs":["Protein amino acids share an alpha carbon attached to an amino group, a carboxyl group, hydrogen and a side chain. Side-chain chemistry changes polarity, charge and packing.","At near-neutral pH, free amino acids usually have ammonium and carboxylate groups. Aspartate and glutamate tend to be negative; lysine and arginine tend to be positive. Histidine protonation depends strongly on its environment."]},"memoryCue":{"title":"1.1 · Gly is the symmetry exception; Cys can cross-link.","paragraphs":["Gly is the symmetry exception; Cys can cross-link.","At near-neutral pH, free amino acids usually have ammonium and carboxylate groups. Aspartate and glutamate tend to be negative; lysine and arginine tend to be positive. Histidine protonation depends strongly on its environment."]},"traps":{"title":"1.1 · Check: Glycine","paragraphs":["Glycine has two hydrogens at its alpha carbon and is achiral. Protein amino acids are predominantly L; L does not mean that every alpha center has an S configuration.","Two cysteine side chains can form a covalent disulfide on oxidation. Methionine contains sulfur but does not form the same disulfide cross-link."]},"application":{"title":"1.1 · Apply: Cysteine","paragraphs":["Two cysteine side chains can form a covalent disulfide on oxidation. Methionine contains sulfur but does not form the same disulfide cross-link.","Protein amino acids share an alpha carbon attached to an amino group, a carboxyl group, hydrogen and a side chain. Side-chain chemistry changes polarity, charge and packing."]}},{"id":"concept-1-2","title":"Acid–Base Chemistry of Amino Acids","section":"1.2","asset":"bc01-02","steps":[{"text":"For one ionizable group, pH below its pKa favors the protonated form; pH above its pKa favors the deprotonated form. Count every group before summing net charge.","focus":["part-0"]},{"text":"The isoelectric point is the pH at which the average net charge is zero. For an amino acid without an ionizable side chain, average the two pKa values that bracket its neutral form.","focus":["part-1"]},{"text":"An acidic or basic side chain changes which two pKa values bracket zero charge. Averaging the smallest and largest pKa without checking charge states can give the wrong pI.","focus":["part-2"]},{"text":"A buffer is most effective near a relevant pKa. At pH = pKa, the deprotonated-to-protonated ratio for that group is one; zero net charge does not mean all groups are uncharged.","focus":["part-3"]}],"coreRule":{"title":"1.2 · Organize: Low pH","paragraphs":["For one ionizable group, pH below its pKa favors the protonated form; pH above its pKa favors the deprotonated form. Count every group before summing net charge.","The isoelectric point is the pH at which the average net charge is zero. For an amino acid without an ionizable side chain, average the two pKa values that bracket its neutral form."]},"memoryCue":{"title":"1.2 · Above pKa, subtract a proton; bracket zero to find pI.","paragraphs":["Above pKa, subtract a proton; bracket zero to find pI.","The isoelectric point is the pH at which the average net charge is zero. For an amino acid without an ionizable side chain, average the two pKa values that bracket its neutral form."]},"traps":{"title":"1.2 · Check: High pH","paragraphs":["An acidic or basic side chain changes which two pKa values bracket zero charge. Averaging the smallest and largest pKa without checking charge states can give the wrong pI.","A buffer is most effective near a relevant pKa. At pH = pKa, the deprotonated-to-protonated ratio for that group is one; zero net charge does not mean all groups are uncharged."]},"application":{"title":"1.2 · Apply: Buffer region","paragraphs":["A buffer is most effective near a relevant pKa. At pH = pKa, the deprotonated-to-protonated ratio for that group is one; zero net charge does not mean all groups are uncharged.","For one ionizable group, pH below its pKa favors the protonated form; pH above its pKa favors the deprotonated form. Count every group before summing net charge."]}},{"id":"concept-1-3","title":"Peptide Bond Formation and Hydrolysis","section":"1.3","asset":"bc01-03","steps":[{"text":"A peptide bond is an amide linkage between a carboxyl-derived carbon and an amino-derived nitrogen. The chain is conventionally read from its N terminus toward its C terminus.","focus":["part-0"]},{"text":"Resonance gives the peptide C–N bond partial double-bond character, making the peptide unit approximately planar. Rotation around the adjacent backbone bonds still permits conformations.","focus":["part-1"]},{"text":"Hydrolysis cleaves the amide using water. Cellular peptide synthesis uses activated substrates and ribosomal machinery; it is not spontaneous dehydration of free amino acids in water.","focus":["part-2"]},{"text":"A linear chain of n amino acids has n minus one peptide bonds. Side chains retain their identities, while most internal backbone amino and carboxyl groups are tied up in amides.","focus":["part-3"]}],"coreRule":{"title":"1.3 · Organize: Free amino acids","paragraphs":["A peptide bond is an amide linkage between a carboxyl-derived carbon and an amino-derived nitrogen. The chain is conventionally read from its N terminus toward its C terminus.","Resonance gives the peptide C–N bond partial double-bond character, making the peptide unit approximately planar. Rotation around the adjacent backbone bonds still permits conformations."]},"memoryCue":{"title":"1.3 · N to C reads the chain; n residues need n minus one links.","paragraphs":["N to C reads the chain; n residues need n minus one links.","Resonance gives the peptide C–N bond partial double-bond character, making the peptide unit approximately planar. Rotation around the adjacent backbone bonds still permits conformations."]},"traps":{"title":"1.3 · Check: N terminus","paragraphs":["Hydrolysis cleaves the amide using water. Cellular peptide synthesis uses activated substrates and ribosomal machinery; it is not spontaneous dehydration of free amino acids in water.","A linear chain of n amino acids has n minus one peptide bonds. Side chains retain their identities, while most internal backbone amino and carboxyl groups are tied up in amides."]},"application":{"title":"1.3 · Apply: C terminus","paragraphs":["A linear chain of n amino acids has n minus one peptide bonds. Side chains retain their identities, while most internal backbone amino and carboxyl groups are tied up in amides.","A peptide bond is an amide linkage between a carboxyl-derived carbon and an amino-derived nitrogen. The chain is conventionally read from its N terminus toward its C terminus."]}},{"id":"concept-1-4","title":"Primary and Secondary Protein Structure","section":"1.4","asset":"bc01-04","steps":[{"text":"Primary structure is the covalent amino-acid sequence. A sequence substitution can change higher-order folding even when chain length remains constant.","focus":["part-0"]},{"text":"Alpha helices and beta sheets are secondary structures stabilized chiefly by hydrogen bonding between backbone carbonyl oxygens and amide hydrogens.","focus":["part-1"]},{"text":"In an alpha helix, side chains project outward. Beta sheets contain aligned strands that may be parallel or antiparallel; side chains alternate above and below the sheet.","focus":["part-2"]},{"text":"Proline and glycine affect conformational preferences, but a sequence motif does not guarantee one fold in every context. Secondary structure is not synonymous with side-chain bonding.","focus":["part-3"]}],"coreRule":{"title":"1.4 · Organize: Sequence","paragraphs":["Primary structure is the covalent amino-acid sequence. A sequence substitution can change higher-order folding even when chain length remains constant.","Alpha helices and beta sheets are secondary structures stabilized chiefly by hydrogen bonding between backbone carbonyl oxygens and amide hydrogens."]},"memoryCue":{"title":"1.4 · Sequence first; backbone hydrogen bonds build helices and sheets.","paragraphs":["Sequence first; backbone hydrogen bonds build helices and sheets.","Alpha helices and beta sheets are secondary structures stabilized chiefly by hydrogen bonding between backbone carbonyl oxygens and amide hydrogens."]},"traps":{"title":"1.4 · Check: Beta sheet","paragraphs":["In an alpha helix, side chains project outward. Beta sheets contain aligned strands that may be parallel or antiparallel; side chains alternate above and below the sheet.","Proline and glycine affect conformational preferences, but a sequence motif does not guarantee one fold in every context. Secondary structure is not synonymous with side-chain bonding."]},"application":{"title":"1.4 · Apply: Backbone H bonds","paragraphs":["Proline and glycine affect conformational preferences, but a sequence motif does not guarantee one fold in every context. Secondary structure is not synonymous with side-chain bonding.","Primary structure is the covalent amino-acid sequence. A sequence substitution can change higher-order folding even when chain length remains constant."]}},{"id":"concept-1-5","title":"Tertiary and Quaternary Protein Structure","section":"1.5","asset":"bc01-05","steps":[{"text":"Tertiary structure describes the three-dimensional organization of one polypeptide. Hydrophobic burial often favors nonpolar side chains inside soluble proteins.","focus":["part-0"]},{"text":"Hydrogen bonds, ionic interactions, dispersion forces and sometimes disulfides help stabilize a fold. Membrane proteins face a different environment from soluble proteins.","focus":["part-1"]},{"text":"Quaternary structure describes association among multiple polypeptide subunits. A functional monomer has tertiary structure without requiring quaternary structure.","focus":["part-2"]},{"text":"Changes at a subunit interface can alter cooperativity or assembly without breaking peptide bonds. Always identify whether a question concerns one chain or a multi-chain complex.","focus":["part-3"]}],"coreRule":{"title":"1.5 · Organize: Hydrophobic core","paragraphs":["Tertiary structure describes the three-dimensional organization of one polypeptide. Hydrophobic burial often favors nonpolar side chains inside soluble proteins.","Hydrogen bonds, ionic interactions, dispersion forces and sometimes disulfides help stabilize a fold. Membrane proteins face a different environment from soluble proteins."]},"memoryCue":{"title":"1.5 · Tertiary is one chain folded; quaternary is chains assembled.","paragraphs":["Tertiary is one chain folded; quaternary is chains assembled.","Hydrogen bonds, ionic interactions, dispersion forces and sometimes disulfides help stabilize a fold. Membrane proteins face a different environment from soluble proteins."]},"traps":{"title":"1.5 · Check: Single-chain fold","paragraphs":["Quaternary structure describes association among multiple polypeptide subunits. A functional monomer has tertiary structure without requiring quaternary structure.","Changes at a subunit interface can alter cooperativity or assembly without breaking peptide bonds. Always identify whether a question concerns one chain or a multi-chain complex."]},"ap ractions, dispersion forces and sometimes disulfides help stabilize a fold. Membrane proteins face a different environment from soluble proteins.","Quaternary structure describes association among multiple polypeptide subunits. A functional monomer has tertiary structure without requiring quaternary structure."]}]},{"id":"bc-01-06-workshop-v1","title":"Denaturation","asset":"bc01-06","stages":[{"id":"map","type":"selection","prompt":"Select the state most directly associated with loss of native tertiary organization.","answer":["part-2"],"explanation":"The relevant schematic entity or entities are Unfolded chain. Some unfolded proteins refold when native conditions return; others aggregate or require assistance. Reversibility depends on sequence, damage and environment.","hints":["Identify the role named in the prompt before selecting a diagram entity.","Some unfolded proteins refold when native conditions return; others aggregate or require assistance. Reversibility depends on sequence, damage and environment."]},{"id":"reason","type":"choice","prompt":"Which event is not required for denaturation?","answer":3,"options":["Loss of native folding","Disruption of some noncovalent interactions","Change in functional conformation","Cleavage of the primary peptide chain"],"explanation":"Cleavage of the primary peptide chain. Ordinary denaturation does not by itself mean peptide-bond hydrolysis. Reducing agents specifically disrupt disulfides, whereas detergents can disrupt noncovalent packing.","hints":["Denaturation disrupts a protein’s native higher-order structure and often its function. Heat, extreme pH and certain solvents can disturb stabilizing interactions.","Ordinary denaturation does not by itself mean peptide-bond hydrolysis. Reducing agents specifically disrupt disulfides, whereas detergents can disrupt noncovalent packing."]},{"id":"transfer","type":"choice","prompt":"An unfolded protein aggregates after cooling. What follows?","answer":0,"options":["Refolding was not guaranteed","Its sequence must be intact and active","All denaturation is reversible","Aggregation proves peptide hydrolysis"],"explanation":"Refolding was not guaranteed. Some unfolded proteins refold when native conditions return; others aggregate or require assistance. Reversibility depends on sequence, damage and environment.","hints":["Ordinary denaturation does not by itself mean peptide-bond hydrolysis. Reducing agents specifically disrupt disulfides, whereas detergents can disrupt noncovalent packing.","Some unfolded proteins refold when native conditions return; others aggregate or require assistance. Reversibility depends on sequence, damage and environment."]}]}]},{"version":1,"id":"chapter-02","title":"Enzymes","status":"implemented","scopeNote":"Original condensed MCAT biochemistry lessons covering the declared outline sections. This release is implemented, not independently scientifically verified; it is not exhaustive textbook coverage.","lessons":[{"id":"concept-2-1","title":"Enzymes as Biological Catalysts","section":"2.1","asset":"bc02-01","steps":[{"text":"Enzymes accelerate reactions by lowering the activation free-energy barrier. They are regenerated during a catalytic cycle rather than consumed stoichiometrically.","focus":["part-0"]},{"text":"A catalyst does not change the free-energy difference between reactants and products, the equilibrium constant, or the equilibrium composition at fixed conditions.","focus":["part-1"]},{"text":"Both forward and reverse reactions can accelerate. An enzyme cannot make an isolated thermodynamically unfavorable conversion favorable merely by binding substrate.","focus":["part-2"]},{"text":"Coupling to a favorable reaction can drive a net process. Separate this change in the overall reaction from catalysis of an unchanged reaction.","focus":["part-3"]}],"coreRule":{"title":"2.1 · Organize: Reactants","paragraphs":["Enzymes accelerate reactions by lowering the activation free-energy barrier. They are -2"]},{"text":"Organic coenzymes and inorganic cofactors can participate in catalysis. A missing required cofactor can limit activity even when the protein sequence is normal.","focus":["part-3"]}],"coreRule":{"title":"2.2 · Organize: Substrate binding","paragraphs":["Active sites bring reactants into useful orientations and provide a local chemical environment. Induced fit means binding and conformation influence one another.","General acid/base catalysis transfers protons. Covalent catalysis temporarily links enzyme and substrate; metal ions may stabilize charge or organize reacting groups."]},"memoryCue":{"title":"2.2 · Fit the transition state, not just the resting substrate.","paragraphs":["Fit the transition state, not just the resting substrate.","General acid/base catalysis transfers protons. Covalent catalysis temporarily links enzyme and substrate; metal ions may stabilize charge or organize reacting groups."]},"traps":{"title":"2.2 · Check: Transition state","paragraphs":["Preferential stabilization of a transition state lowers the barrier. Binding the ground-state substrate extremely tightly without transition-state stabilization can impede turnover.","Organic coenzymes and inorganic cofactors can participate in catalysis. A missing required cofactor can limit activity even when the protein sequence is normal."]},"application":{"title":"2.2 · Apply: Product release","paragraphs":["Organic coenzymes and inorganic cofactors can participate in catalysis. A missing required cofactor can limit activity even when the protein sequence is normal.","Active sites bring reactants into useful orientations and provide a local chemical environment. Induced fit means binding and conformation influence one another."]}},{"id":"concept-2-3","title":"Enzyme Kinetics","section":"2.3","asset":"bc02-03","steps":[{"text":"For a simple Michaelis–Menten enzyme measured at initial rate, v = Vmax[S]/(Km + [S]). At [S] = Km, v equals half of Vmax.","focus":["part-0"]},{"text":"At saturating substrate, v approaches Vmax. With all else fixed, increasing active enzyme concentration increases Vmax; kcat is Vmax divided by total active enzyme concentration.","focus":["part-1"]},{"text":"Ideal competitive inhibition increases apparent Km without changing Vmax. Pure noncompetitive inhibition decreases Vmax without changing Km; mixed inhibition need not preserve Km.","focus":["part-2"]},{"text":"Cooperative enzymes may show sigmoidal rather than Michaelis–Menten behavior. Km is not universally a direct dissociation constant or a universal measure of affinity.","focus":["part-3"]}],"coreRule":{"title":"2.3 · Organize: Low substrate","paragraphs":["For a simple Michaelis–Menten enzyme measured at initial rate, v = Vmax[S]/(Km + [S]). At [S] = Km, v equals half of Vmax.","At saturating substrate, v approaches Vmax. With all else fixed, increasing active enzyme concentration increases Vmax; kcat is Vmax divided by total active enzyme concentration."]},"memoryCue":{"title":"2.3 · Km marks half Vmax in the simple model.","paragraphs":["Km marks half Vmax in the simple model.","At saturating substrate, v approaches Vmax. With all else fixed, increasing active enzyme concentration increases Vmax; kcat is Vmax divided by total active enzyme concentration."]},"traps":{"title":"2.3 · Check: Saturation","paragraphs":["Ideal competitive inhibition increases apparent Km without changing Vmax. Pure noncompetitive inhibition decreases Vmax without changing Km; mixed inhibition need not preserve Km.","Cooperative enzymes may show sigmoidal rather than Michaelis–Menten behavior. Km is not universally a direct dissociation constant or a universal measure of affinity."]},"application":{"title":"2.3 · Apply: Inhibition","paragraphs":["Cooperative enzymes may show sigmoidal rather than Michaelis–Menten behavior. Km is not universally a direct dissociation constant or a universal measure of affinity.","For a simple Michaelis–Menten enzyme measured at initial rate, v = Vmax anation":"Its effect depends on the target enzyme. An end product can inhibit an earlier pathway step, limiting excess production. This feedback mechanism is distinct from merely exhausting the initial substrate.","hints":["Reversible phosphorylation changes some enzymes’ activities; its effect depends on the particular enzyme. Phosphorylation is not a universal on switch.","An end product can inhibit an earlier pathway step, limiting excess production. This feedback mechanism is distinct from merely exhausting the initial substrate."]}]}]},{"version":1,"id":"chapter-03","title":"Nonenzymatic Protein Function and Protein Analysis","status":"implemented","scopeNote":"Original condensed MCAT biochemistry lessons covering the declared outline sections. This release is implemented, not independently scientifically verified; it is not exhaustive textbook coverage.","lessons":[{"id":"concept-3-1","title":"Cellular Functions","section":"3.1","asset":"bc03-01","steps":[{"text":"Proteins provide structural support, transport cargo, generate force and bind signals as well as catalyze reactions. Function depends on conformation and context.","focus":["part-0"]},{"text":"Hemoglobin carries oxygen with cooperative subunit interactions. Myoglobin is a monomeric oxygen-binding protein whose binding curve is typically hyperbolic.","focus":["part-1"]},{"text":"Actin and myosin participate in force generation. A motor converts chemical energy into directed mechanical work rather than producing energy from nothing.","focus":["part-2"]},{"text":"Binding affinity and transport capacity are distinct. A change that shifts oxygen affinity need not change the number of available binding sites.","focus":["part-3"]}],"coreRule":{"title":"3.1 · Organize: Mechanical support","paragraphs":["Proteins provide structural support, transport cargo, generate force and bind signals as well as catalyze reactions. Function depends on conformation and context.","Hemoglobin carries oxygen with cooperative subunit interactions. Myoglobin is a monomeric oxygen-binding protein whose binding curve is typically hyperbolic."]},"memoryCue":{"title":"3.1 · Myoglobin binds alone; hemoglobin coordinates subunits.","paragraphs":["Myoglobin binds alone; hemoglobin coordinates subunits.","Hemoglobin carries oxygen with cooperative subunit interactions. Myoglobin is a monomeric oxygen-binding protein whose binding curve is typically hyperbolic."]},"traps":{"title":"3.1 · Check: Motor activity","paragraphs":["Actin and myosin participate in force generation. A motor converts chemical energy into directed mechanical work rather than producing energy from nothing.","Binding affinity and transport capacity are distinct. A change that shifts oxygen affinity need not change the number of available binding sites."]},"application":{"title":"3.1 · Apply: Ligand binding","paragraphs":["Binding affinity and transport capacity are distinct. A change that shifts oxygen affinity need not change the number of available binding sites.","Proteins provide structural support, transport cargo, generate force and bind signals as well as catalyze reactions. Function depends on conformation and context."]}},{"id":"concept-3-2","title":"Biosignaling","section":"3.2","asset":"bc03-02","steps":[{"text":"A signaling ligand binds a receptor, which changes downstream activity. Receptor occupancy and the magnitude of a cell response are related but not identical.","focus":["part-0"]},{"text":"A G-protein pathway can amplify signaling through second messengers. GTP hydrolysis helps switch a G protein off; amplification does not imply an unlimited response.","focus":["part-1"]},{"text":"Receptor tyrosine kinases often signal through ligand-induced association and phosphorylation. Intracellular receptors can regulate transcription after binding permeant ligands.","focus":["part-2"]},{"text":"Desensitization and feedback restrain responses. Distinguish a binding defect from a downstream relay defect by testing both ligand binding and cell output.","focus":["part-3"]}],"coreRule":{"title":"3.2 · Organize: Ligand","paragraphs":["A signaling ligand binds a receptor, which changes downstream activity. Receptor occupancy and the magnitude of a cell response are related but not identical.","A G-protein pathway can amplify signaling through second messengers. GTP hydrolysis helps switch a G protein off; amplification does not imply an unlimited response."]},"memoryCue":{"title":"3.2 · Reception, relay and response are separate checkpoints.","paragraphs":["Reception, relay and response are separate checkpoints.","A G-protein pathway can amplify signaling through second messengers. GTP hydrolysis helps switch a G protein off; amplification does not imply an unlimited response."]},"traps":{"title":"3.2 · Check: Signal relay","paragraphs":["Receptor tyrosine kinases often signal through ligand-induced association and phosphorylation. Intracellular receptors can regulate transcription after binding permeant ligands.","Desensitization and feedback restrain responses. Distinguish a binding defect from a downstream relay defect by testing both ligand binding and cell output."]},"application":{"title":"3.2 · Apply: Cell response","paragraphs":["Desensitization and feedback restrain responses. Distinguish a binding defect from a downstream relay defect by testing both ligand binding and cell output.","A signaling ligand binds a receptor, which changes downstream activity. Receptor occupancy and the magnitude of a cell response are related but not identical."]}},{"id":"concept-3-3","title":"Protein Isolation","section":"3.3","asset":"bc03-03","steps":[{"text":"Purification separates proteins using different properties. A crude mixture can be fractionated before a more selective step; yield and purity must be tracked separately.","focus":["part-0"]},{"text":"In size-exclusion chromatography, larger species generally elute earlier because they enter fewer pores. This ordering differs from migration through an SDS gel.","focus":["part-1"]},{"text":"Ion exchange separates by charge at the chosen pH. A positively charged anion-exchange resin binds negatively charged analytes; salt or pH changes can elute them.","focus":["part-2"]},{"text":"Affinity purification uses a specific binding interaction. Strong binding to a ligand does not establish catalytic activity; assay the fractions to locate active protein.","focus":["part-3"]}],"coreRule":{"title":"3.3 · Organize: Size exclusion","paragraphs":["Purification separates proteins using different properties. A crude mixture can be fractionated before a more selective step; yield and purity must be tracked separately.","In size-exclusion chromatography, larger species generally elute earlier because they enter fewer pores. This ordering differs from migration through an SDS gel."]},"memoryCue":{"title":"3.3 · Large exits size exclusion early; small runs SDS gels farther.","paragraphs":["Large exits size exclusion early; small runs SDS gels farther.","In size-exclusion chromatography, larger species generally elute earlier because they enter fewer pores. This ordering differs from migration through an SDS gel."]},"traps":{"title":"3.3 · Check: Affinity column","paragraphs":["Ion exchange separates by charge at the chosen pH. A positively charged anion-exchange resin binds negatively charged analytes; salt or pH changes can elute them.","Affinity purification uses a specific binding interaction. Strong binding to a ligand does not establish catalytic activity; assay the fractions to locate active protein."]},"application":{"title":"3.3 · Apply: Collected fractions","paragraphs":["Affinity purification uses a specific binding interaction. Strong binding to a ligand does not establish catalytic activity; assay the fractions to locate active protein.","Purification separates proteins using different properties. A crude mixture can be fractionated before a more selective step; yield and purity must be tracked separately."]}},{"id":"concept-3-4","title":"Protein Analysis","section":"3.4","asset":"bc03-04","steps":[{"text":"SDS-PAGE denatures proteins and gives a roughly uniform negative charge-to-mass ratio, so separation primarily reflects polypeptide size. Smaller chains usually migrate farther.","focus":["part-0"]},{"text":"Reducing SDS-PAGE can separate chains linked by disulfides. Nonreducing conditions preserve those disulfide links but still disrupt many noncovalent associations.","focus":["part-1"]},{"text":"Isoelectric focusing separates proteins according to pI in a pH gradient. Native electrophoresis depends on charge, size and shape together.","focus":["part-2"]},{"text":"A band demonstrates staining of material, not necessarily biological function. Pair electrophoretic evidence with an activity assay when assessing active enzyme recovery.","focus":["part-3"]}],"coreRule":{"title":"3.4 · Organize: SDS-PAGE","paragraphs":["SDS-PAGE denatures proteins and gives a roughly uniform negative charge-to-mass ratio, so separation primarily reflects polypeptide size. Smaller chains usually migrate farther.","Reducing SDS-PAGE can separate chains linked by disulfides. Nonreducing conditions preserve those disulfide links but still disrupt many noncovalent associations."]},"memoryCue":{"title":"3.4 · A band shows material; an activity assay shows function.","paragraphs":["A band shows material; an activity assay shows function.","Reducing SDS-PAGE can separate chains linked by disulfides. Nonreducing conditions preserve those disulfide links but still disrupt many noncovalent associations."]},"traps":{"title":"3.4 · Check: Isoelectric focusing","paragraphs":["Isoelectric focusing separates proteins according to pI in a pH gradient. Native electrophoresis depends on charge, size and shape together.","A band demonstrates staining of material, not necessarily biological function. Pair electrophoretic evidence with an activity assay when assessing active enzyme recovery."]},"applicati ole named in the prompt before selecting a diagram entity.","A band demonstrates staining of material, not necessarily biological function. Pair electrophoretic evidence with an activity assay when assessing active enzyme recovery."]},{"id":"reason","type":"choice","prompt":"Which technique separates proteins according to pI?","answer":3,"options":["Reducing SDS-PAGE alone","Size exclusion alone","A catalytic activity assay alone","Isoelectric focusing"],"explanation":"Isoelectric focusing. Reducing SDS-PAGE can separate chains linked by disulfides. Nonreducing conditions preserve those disulfide links but still disrupt many noncovalent associations.","hints":["SDS-PAGE denatures proteins and gives a roughly uniform negative charge-to-mass ratio, so separation primarily reflects polypeptide size. Smaller chains usually migrate farther.","Reducing SDS-PAGE can separate chains linked by disulfides. Nonreducing conditions preserve those disulfide links but still disrupt many noncovalent associations."]},{"id":"transfer","type":"choice","prompt":"A disulfide-linked dimer gives one smaller band after reduction. What was disrupted?","answer":0,"options":["Covalent links between polypeptide chains","Every backbone peptide bond","All side-chain carbon bonds","The amino-acid genetic code"],"explanation":"Covalent links between polypeptide chains. Isoelectric focusing separates proteins according to pI in a pH gradient. Native electrophoresis depends on charge, size and shape together.","hints":["Reducing SDS-PAGE can separate chains linked by disulfides. Nonreducing conditions preserve those disulfide links but still disrupt many noncovalent associations.","Isoelectric focusing separates proteins according to pI in a pH gradient. Native electrophoresis depends on charge, size and shape together."]}]}]},{"version":1,"id":"chapter-04","title":"Carbohydrate Structure and Function","status":"implemented","scopeNote":"Original condensed MCAT biochemistry lessons covering the declared outline sections. This release is implemented, not independently scientifically verified; it is not exhaustive textbook coverage.","lessons":[{"id":"concept-4-1","title":"Carbohydrate Classification","section":"4.1","asset":"bc04-01","steps":[{"text":"Monosaccharides can be classified by carbon number and carbonyl position. An aldose has an aldehyde in its open-chain form; a ketose has a ketone.","focus":["part-0"]},{"text":"The D/L designation compares configuration at a reference stereocenter with glyceraldehyde. It does not specify the sign of optical rotation.","focus":["part-1"]},{"text":"Enantiomers differ at every stereocenter. Epimers are diastereomers differing at one stereocenter; anomers differ at the anomeric carbon after cyclization.","focus":["part-2"]},{"text":"Carbonyl classification and configuration are independent descriptors. A D sugar can be an aldose or a ketose, and ring formation does not erase its stereochemical identity.","focus":["part-3"]}],"coreRule":{"title":"4.1 · Organize: Aldose","paragraphs":["Monosaccharides can be classified by carbon number and carbonyl position. An aldose has an aldehyde in its open-chain form; a ketose has a ketone.","The D/L designation compares configuration at a reference stereocenter with glyceraldehyde. It does not specify the sign of optical rotation."]},"memoryCue":{"title":"4.1 · D names configuration, not the direction of rotation.","paragraphs":["D names configuration, not the direction of rotation.","The D/L designation compares configuration at a reference stereocenter with glyceraldehyde. It does not specify the sign of optical rotation."]},"traps":{"title":"4.1 · Check: D configuration","paragraphs":["Enantiomers differ at every stereocenter. Epimers are diastereomers differing at one stereocenter; anomers differ at the anomeric carbon after cyclization.","Carbonyl classification and configuration are independent descriptors. A D sugar can be an aldose or a ketose, and ring formation does not erase its stereochemical identity."]},"application":{"title":"4.1 · Apply: L configuration","paragraphs":["Carbonyl classification and configuration are independent descriptors. A D sugar can be an aldose or a ketose, and ring formation does not erase its stereochemical identity.","Monosaccharides can be classified by carbon number and carbonyl position. An aldose has an aldehyde in its open-chain form; a ketose has a ketone."]}},{"id":"concept-4-2","title":"Cyclic Sugar Molecules","section":"4.2","asset":"bc04-02","steps":[{"text":"An intramolecular reaction between a hydroxyl and a carbonyl can form a cyclic hemiacetal or hemiketal. The original carbonyl carbon becomes the anomeric carbon.","focus":["part-0"]},{"text":"Cyclization can create alpha and beta anomers. For common D sugars in a conventional Haworth drawing, alpha places the anomeric substituent opposite the reference CH2OH group.","focus":["part-1"]},{"text":"A free anomeric hemiacetal can reopen and interconvert anomers by mutarotation. A glycosidic acetal at that carbon prevents the same free ring-opening behavior.","focus":["part-2"]},{"text":"Pyranose and furanose name six- and five-membered rings including the ring oxygen. They do not count only carbon atoms or specify total molecular carbon count.","focus":["part-3"]}],"coreRule":{"title":"4.2 · Organize: Open chain","paragraphs":["An intramolecular reaction between a hydroxyl and a carbonyl can form a cyclic hemiacetal or hemiketal. The original carbonyl carbon becomes the anomeric carbon.","Cyclization can create alpha and beta anomers. For common D sugars in a conventional Haworth drawing, alpha places the anomeric substituent opposite the reference CH2OH group."]},"memoryCue":{"title":"4.2 · The carbonyl carbon becomes the anomeric carbon.","paragraphs":["The carbonyl carbon becomes the anomeric carbon.","Cyclization can create alpha and beta anomers. For common D sugars in a conventional Haworth drawing, alpha places the anomeric substituen  · Glucose to mannose: C2; glucose to galactose: C4.","paragraphs":["Glucose to mannose: C2; glucose to galactose: C4.","Fructose is a ketohexose. Equal elemental composition does not imply equal connectivity or identical enzyme recognition."]},"traps":{"title":"4.3 · Check: Mannose","paragraphs":["A reducing sugar can generate a reactive carbonyl under the assay conditions. Ketoses can also test positive in common alkaline reducing-sugar assays through rearrangement.","Enzymes recognize stereochemistry: the ability of one sugar to enter a pathway does not prove another stereoisomer uses the same enzyme or transport route."]},"application":{"title":"4.3 · Apply: Fructose","paragraphs":["Enzymes recognize stereochemistry: the ability of one sugar to enter a pathway does not prove another stereoisomer uses the same enzyme or transport route.","Glucose, galactose and mannose are common aldohexoses. Relative to glucose, galactose differs at C4 and mannose at C2 in their open-chain configurations."]}},{"id":"concept-4-4","title":"Complex Carbohydrates","section":"4.4","asset":"bc04-04","steps":[{"text":"Glycosidic linkages specify the connected carbons and anomeric configuration. Glycogen has alpha(1→4) chains and alpha(1→6) branch points.","focus":["part-0"]},{"text":"Cellulose contains beta(1→4)-linked glucose units. Human digestive enzymes do not efficiently hydrolyze these linkages, despite glucose being usable as a monomer.","focus":["part-1"]},{"text":"Sucrose links both constituent anomeric carbons and is nonreducing. Lactose retains a free anomeric carbon and is reducing.","focus":["part-2"]},{"text":"A branched glycogen particle has many nonreducing ends for synthesis and degradation. Branching does not create a free reducing end at every branch.","focus":["part-3"]}],"coreRule":{"title":"4.4 · Organize: Glycogen","paragraphs":["Glycosidic linkages specify the connected carbons and anomeric configuration. Glycogen has alpha(1→4) chains and alpha(1→6) branch poin ogy","status":"implemented","scopeNote":"Original condensed MCAT biochemistry lessons covering the declared outline sections. This release is implemented, not independently scientifically verified; it is not exhaustive textbook coverage.","lessons":[{"id":"concept-6-1","title":"DNA Structure","section":"6.1","asset":"bc06-01","steps":[{"text":"DNA contains deoxyribonucleotides linked by 3′–5′ phosphodiester bonds. The two strands of a typical duplex run in opposite directions.","focus":["part-0"]},{"text":"A pairs with T and G with C in canonical DNA base pairing. Hydrogen bonding and base stacking contribute to duplex stability; sequence and conditions both matter.","focus":["part-1"]},{"text":"A strand written 5′-AGTC-3′ pairs with 3′-TCAG-5′. When both are written 5′ to 3′, the complementary sequence is the reverse complement, 5′-GACT-3′.","focus":["part-2"]},{"text":"Denaturation separates paired strands without necessarily hydrolyzing the covalent backbone. GC content influences melting behavior, but salt and length also matter.","focus":["part-3"]}],"coreRule":{"title":"6.1 · Organize: Antiparallel strands","paragraphs":["DNA contains deoxyribonucleotides linked by 3′–5′ phosphodiester bonds. The two strands of a typical duplex run in opposite directions.","A pairs with T and G with C in canonical DNA base pairing. Hydrogen bonding and base stacking contribute to duplex stability; sequence and conditions both matter."]},"memoryCue":{"title":"6.1 · Complement, then reverse when both strands read 5′ to 3′.","paragraphs":["Complement, then reverse when both strands read 5′ to 3′.","A pairs with T and G with C in canonical DNA base pairing. Hydrogen bonding and base stacking contribute to duplex stability; sequence and conditions both matter."]},"traps":{"title":"6.1 · Check: Sugar-phosphate chain","paragraphs":["A strand written 5′-AGTC-3′ pairs with 3′-TCAG-5′. When both are written 5′ to 3′, the complementary sequence is the reverse complement, 5′-GACT-3′.","Denaturation separates paired strands without necessarily hydrolyzing the covalent backbone. GC content influences melting behavior, but salt and length also matter."]},"application":{"title":"6.1 · Apply: Complementarity","paragraphs":["Denaturation separates paired strands without necessarily hydrolyzing the covalent backbone. GC content influences melting behavior, but salt and length also matter.","DNA contains deoxyribonucleotides linked by 3′–5′ phosphodiester bonds. The two strands of a typical duplex run in opposite directions."]}},{"id":"concept-6-2","title":"Eukaryotic Chromosome Organization","section":"6.2","asset":"bc06-02","steps":[{"text":"Eukaryotic DNA wraps around histone proteins to form nucleosomes. Packaging compacts DNA while allowing regulated access for replication, repair and transcription.","focus":["part-0"]},{"text":"Histone tails can receive chemical modifications that influence binding partners and accessibility. The effect depends on the specific modification and genomic context.","focus":["part-1"]},{"text":"Euchromatin is generally more accessible than heterochromatin. This comparison is not a rule that every gene in one region is always on or always off.","focus":["part-2"]},{"text":"Chromatin state is part of gene regulation. A change in transcription can reflect altered access even without changing the underlying DNA sequence.","focus":["part-3"]}],"coreRule":{"title":"6.2 · Organize: Histone core","paragraphs":["Eukaryotic DNA wraps around histone proteins to form nucleosomes. Packaging compacts DNA while allowing regulated access for replication, repair and transcription.","Histone tails can receive chemical modifications that influence binding partners and accessibility. The effect depends on the specific modification and genomic context."]},"memoryCue":{"title":"6.2 · Packaging controls access without changing base sequence.","paragraphs":["Packaging controls access without changing base sequence.","Histone tails can receive che sized more continuously toward fork movement. The lagging strand is assembled as Okazaki fragments."]},"memoryCue":{"title":"6.3 · Polymerase extends the 3′ end, so synthesis runs 5′ to 3′.","paragraphs":["Polymerase extends the 3′ end, so synthesis runs 5′ to 3′.","At a replication fork, the leading strand is synthesized more continuously toward fork movement. The lagging strand is assembled as Okazaki fragments."]},"traps":{"title":"6.3 · Check: Lagging strand","paragraphs":["Primase supplies primers; primer removal, gap filling and ligation complete the daughter strand. Ligase seals a nick rather than synthesizing an entire fragment.","Semiconservative replication gives each daughter duplex one parental strand and one newly synthesized strand. Leading and lagging describe local fork geometry."]},"application":{"title":"6.3 · Apply: Primer","paragraphs":["Semiconservative replication gives each daughter duplex one parental strand and one newly synthesized strand. Leading and lagging describe local fork geometry.","DNA polymerases extend a preexisting strand by adding to its 3′ hydroxyl. New DNA synthesis proceeds 5′ to 3′ while the template is read 3′ to 5′."]}},{"id":"concept-6-4","title":"DNA Repair","section":"6.4","asset":"bc06-04","steps":[{"text":"Replication proofreading and postreplicative repair improve fidelity through different steps. A mismatch is not the same lesion as a chemically damaged base.","focus":["part-0"]},{"text":"Base-excision repair removes selected damaged bases before processing the backbone and filling the gap. Nucleotide-excision repair removes a segment containing a bulky lesion.","focus":["part-1"]},{"text":"Mismatch repair corrects some replication errors that escaped proofreading. Accurate repair requires an appropriate template or strand discrimination mechanism.","focus":["part-2"]},{"text":"Double-strand breaks can be processed by homologous recombination or end joining. These mechanisms differ in template use and error risk; r  is maintained by selective processes","Membrane proteins are absent"],"explanation":"Lipid asymmetry is maintained by selective processes. Membrane proteins can have transport, receptor or anchoring roles. The model does not require every protein to diffuse freely without restriction.","hints":["The two leaflets can differ in lipid composition. Spontaneous movement of many phospholipid head groups across the hydrophobic core is slow without facilitating proteins.","Membrane proteins can have transport, receptor or anchoring roles. The model does not require every protein to diffuse freely without restriction."]}]},{"id":"bc-08-02-workshop-v1","title":"Membrane Components","asset":"bc08-02","stages":[{"id":"map","type":"selection","prompt":"Select the component associated with a membrane surface without necessarily entering the hydrophobic core.","answer":["part-1"],"explanation":"The relevant schematic entity or entities are Peripheral protein. Carbohydrate groups on plasma-membrane glycoproteins and glycolipids generally face the noncytosolic side, contributing to recognition and protection.","hints":["Identify the role named in the prompt before selecting a diagram entity.","Carbohydrate groups on plasma-membrane glycoproteins and glycolipids generally face the noncytosolic side, contributing to recognition and protection."]},{"id":"reason","type":"choice","prompt":"Where do plasma-membrane carbohydrate chains generally face?","answer":2,"options":["The cytosolic side only","The hydrophobic center","The extracellular side","The nuclear DNA backbone"],"explanation":"The extracellular side. Carbohydrate groups on plasma-membrane glycoproteins and glycolipids generally face the noncytosolic side, contributing to recognition and protection.","hints":["Integral proteins interact with the membrane interior; transmembrane proteins span the bilayer. Peripheral proteins associate with a surface or another protein.","Carbohydrate groups on plasma-membrane glycoproteins and coverage.","lessons":[{"id":"concept-9-1","title":"Glucose Transport","section":"9.1","asset":"bc09-01","steps":[{"text":"GLUT transporters mediate facilitated diffusion of glucose. Transport direction depends on the gradient and cellular context rather than an intrinsic one-way pump.","focus":["part-0"]},{"text":"SGLT carriers couple glucose entry to sodium movement, using the sodium electrochemical gradient. The sodium–potassium ATPase helps maintain that driving gradient.","focus":["part-1"]},{"text":"Insulin promotes GLUT4 recruitment to the surface of skeletal muscle and adipose cells. Many other glucose transporters are not acutely recruited in this way.","focus":["part-2"]},{"text":"Glucose phosphorylation lowers free intracellular glucose and supports continued uptake. Transport and intracellular trapping are different steps.","focus":["part-3"]}],"coreRule":{"title":"9.1 · Organize: GLUT carrier","paragraphs":["GLUT transporters mediate facilitated diffusion of glucose. Transport direction depends on the gradient and cellular context rather than an intrinsic one-way pump.","SGLT carriers couple glucose entry to sodium movement, using the sodium electrochemical gradient. The sodium–potassium ATPase helps maintain that driving gradient."]},"memoryCue":{"title":"9.1 · GLUT follows glucose; SGLT couples glucose to sodium.","paragraphs":["GLUT follows glucose; SGLT couples glucose to sodium.","SGLT carriers couple glucose entry to sodium movement, using the sodium electrochemical gradient. The sodium–potassium ATPase helps maintain that driving gradient."]},"traps":{"title":"9.1 · Check: Sodium gradient","paragraphs":["Insulin promotes GLUT4 recruitment to the surface of skeletal muscle and adipose cells. Many other glucose transporters are not acutely recruited in this way.","Glucose phosphorylation lowers free intracellular glucose and supports continued uptake. Transport and intracellular trapping are different steps."]},"application":{"title":"9.1 · Apply: Insulin signal","paragraphs":["Glucose phosphorylation lowers free intracellular glucose and supports continued uptake. Transport and intracellular trapping are different steps.","GLUT transporters mediate facilitated diffusion of glucose. Transport direction depends on the gradient and cellular context rather than an intrinsic one-way pump."]}},{"id":"concept-9-2","title":"Glycolysis","section":"9.2","asset":"bc09-02","steps":[{"text":"Glycolysis converts one glucose into two pyruvates in the cytosol. Two ATP are invested and four are produced, giving a net of two ATP plus two NADH per glucose.","focus":["part-0"]},{"text":"Hexokinase or glucokinase, PFK-1 and pyruvate kinase catalyze strongly regulated steps. PFK-1 commits carbon to glycolysis under typical cellular conditions.","focus":["part-1"]},{"text":"Reduction of pyruvate to lactate regenerates NAD+ so glycolysis can continue when respiratory reoxidation of cytosolic NADH is limited. Lactate formation adds no ATP directly.","focus":["part-2"]},{"text":"Oxygen is not a direct glycolytic substrate. Glycolysis can occur in cells lacking mitochondria, including mature human red blood cells.","focus":["part-3"]}],"coreRule":{"title":"9.2 · Organize: Glucose entry","paragraphs":["Glycolysis converts one glucose into two pyruvates in the cytosol. Two ATP are invested and four are produced, giving a net of two ATP plus two NADH per glucose.","Hexokinase or glucokinase, PFK-1 and pyruvate kinase catalyze strongly regulated steps. PFK-1 commits carbon to glycolysis under typical cellular conditions."]},"memoryCue":{"title":"9.2 · Spend two, make four: net two ATP per glucose.","paragraphs":["Spend two, make four: net two ATP per glucose.","Hexokinase or glucokinase, PFK-1 and pyruvate kinase catalyze strongly regulated steps. PFK-1 commits carbon to glycolysis under typical cellular conditions."]},"traps":{"title":"9.2 · Check: ATP payoff","paragraphs":["Reduction of pyruvate to lactate regenerates NAD+ so glycolysis can continue when respiratory reoxidation of cytosolic NADH is limited. Lactate formation adds no ATP directly.","Oxygen is not a direct glycolytic substrate. Glycolysis can occur in cells lacking mitochondria, including mature human red blood cells."]},"application":{"title":"9.2 · Apply: Pyruvate fate","paragraphs":["Oxygen is not a direct glycolytic substrate. Glycolysis can occur in cells lacking mitochondria, including mature human red blood cells.","Glycolysis converts one glucose into two pyruvates in the cytosol. Two ATP are invested and four are produced, giving a net of two ATP plus two NADH per glucose."]}},{"id":"concept-9-3","title":"Other Monosaccharides","section":"9.3","asset":"bc09-03","steps":[{"text":"Dietary fructose and galactose can feed central carbohydrate metabolism after specific enzyme steps. They do not all enter through the same initial reaction.","focus":["part-0"]},{"text":"In liver, fructokinase and aldolase B route fructose carbon toward triose intermediates, bypassing the PFK-1 entry step. This does not abolish every form of metabolic regulation.","focus":["part-1"]},{"text":"Galactose is converted through the Leloir pathway toward glucose-derived intermediates. Blocking a pathway enzyme can accumulate upstream compounds.","focus":["part-2"]},{"text":"For a pathway block, identify the affected step before predicting upstream accumulation and downstream shortage. A metabolite’s name alone does not determine its cellular toxicity.","focus":["part-3"]}],"coreRule":{"title":"9.3 · Organize: Fructose input","paragraphs":["Dietary fructose and galactose can feed central carbohydrate metabolism after specific enzyme steps. They do not all enter through the same initial reaction.","In liver, fructokinase and aldolase B route fructose carbon toward triose intermediates, bypassing the PFK-1 entry step. This does not abolish every form of metabolic regulation."]},"memoryCue":{"title":"9.3 · Different sugars enter through different enzyme gates.","paragraphs":["Different sugars enter through different enzyme gates.","In liver, fructokinase and aldolase B route fructose carbon toward triose intermediates, bypassing the PFK-1 entry step. This does not abolish every form of metabolic regulation."]},"traps":{"title":"9.3 · Check: Shared intermediates","paragraphs":["Galactose is converted through the Leloir pathway toward glucose-derived intermediates. Blocking a pathway enzyme can accumulate upstream compounds.","For a pathway block, identify the affected step before predicting upstream accumulation and downstream shortage. A metabolite’s name alone does not determine its cellular toxicity."]},"application":{"title":"9.3 · Apply: Glycolytic pathway","paragraphs":["For a pathway block, identify the affected step before predicting upstream accumulation and downstream shortage. A metabolite’s name alone does not determine its cellular toxicity.","Dietary fructose and galactose can feed central carbohydrate metabolism after specific enzyme steps. They do not all enter through the same initial reaction."]}},{"id":"concept-9-4","title":"Pyruvate Dehydrogenase","section":"9.4","asset":"bc09-04","steps":[{"text":"The mitochondrial pyruvate dehydrogenase complex converts pyruvate to acetyl-CoA with CO2 release and NAD+ reduction. The reaction links glycolysis to acetyl-unit oxidation.","focus":["part-0"]},{"text":"Its cofactors include TPP, lipoamide, CoA, FAD and NAD+. These helpers support decarboxylation, acyl transfer and electron transfer in the complex.","focus":["part-1"]},{"text":"Phosphorylation by PDH kinase inhibits PDH in the standard mammalian model; dephosphorylation activates it. Energy-rich signals tend to restrain pyruvate oxidation.","focus":["part-2"]},{"text":"PDH is effectively irreversible in human metabolism. Acetyl-CoA cannot simply reverse PDH to supply net pyruvate for glucose synthesis.","focus":["part-3"]}],"coreRule":{"title":"9.4 · Organize: Pyruvate","paragraphs":["The mitochondrial pyruvate dehydrogenase complex converts pyruvate to acetyl-CoA with CO2 release and NAD+ reduction. The reaction links glycolysis to acetyl-unit oxidation.","Its cofactors include TPP, lipoamide, CoA, FAD and NAD+. These helpers support decarboxylation, acyl transfer and electron transfer in the complex."]},"memoryCue":{"title":"9.4 · PDH links pyruvate to acetyl-CoA with carbon and electron release.","paragraphs":["PDH links pyruvate to acetyl-CoA with carbon and electron release.","Its cofactors include TPP, lipoamide, CoA, FAD and NAD+. These helpers support decarboxylation, acyl transfer and electron transfer in the complex."]},"traps":{"title":"9.4 · Check: Acetyl-CoA","paragraphs":["Phosphorylation by PDH kinase inhibits PDH in the standard mammalian model; dephosphorylation activates it. Energy-rich signals tend to restrain pyruvate oxidation.","PDH is effectively irreversible in human metabolism. Acetyl-CoA cannot simply reverse PDH to supply net pyruvate for glucose synthesis."]},"application":{"title":"9.4 · Apply: NADH and CO2","paragraphs":["PDH is effectively irreversible in human metabolism. Acetyl-CoA cannot simply reverse PDH to supply net pyruvate for glucose synthesis.","The mitochondrial pyruvate dehydrogenase complex converts pyruvate to acetyl-CoA with CO2 release and NAD+ reduction. The reaction links glycolysis to acetyl-unit oxidation."]}},{"id":"concept-9-5","title":"Glycogenesis and Glycogenolysis","section":"9.5","asset":"bc09-05","steps":[{"text":"Glycogenesis extends glycogen using activated glucose donors. Glycogen synthase makes alpha(1→4) linkages and branching enzyme introduces alpha(1→6) branches.","focus":["part-0"]},{"text":"Glycogen phosphorylase releases glucose-1-phosphate from nonreducing ends. A debranching enzyme handles branch regions that phosphorylase cannot fully resolve.","focus":["part-1"]},{"text":"Liver glycogen supports blood glucose because liver can release free glucose. Skeletal muscle generally uses its glycogen locally and lacks appreciable glucose-6-phosphatase activity.","focus":["part-2"]},{"text":"Insulin favors glycogen storage, while glucagon stimulates hepatic mobilization. Epinephrine can promote mobilization in muscle; glucagon does not directly play the same muscle role.","focus":["part-3"]}],"coreRule":{"title":"9.5 · Organize: Glycogen synthase","paragraphs":["Glycogenesis extends glycogen using activated glucose donors. Glycogen synthase makes alpha(1→4) linkages and branching enzyme introduces alpha(1→6) branches.","Glycogen phosphorylase releases glucose-1-phosphate from nonreducing ends. A debranching enzyme handles branch regions that phosphorylase cannot fully resolve."]},"memoryCue":{"title":"9.5 · Liver can share glucose; muscle glycogen supports muscle.","paragraphs":["Liver can share glucose; muscle glycogen supports muscle.","Glycogen phosphorylase releases glucose-1-phosphate from nonreducing ends. A debranching enzyme handles branch regions that phosphorylase cannot fully resolve."]},"traps":{"title":"9.5 · Check: Glycogen phosphorylase","paragraphs":["Liver glycogen supports blood glucose because liver can release free glucose. Skeletal muscle generally uses its glycogen locally and lacks appreciable glucose-6-phosphatase activity.","Insulin favors glycogen storage, while glucagon stimulates hepatic mobilization. Epinephrine can promote mobilization in muscle; glucagon does not directly play the same muscle role."]},"application":{"title":"9.5 · Apply: Debranching enzyme","paragraphs":["Insulin favors glycogen storage, while glucagon stimulates hepatic mobilization. Epinephrine can promote mobilization in muscle; glucagon does not directly play the same muscle role.","Glycogenesis extends glycogen using activated glucose donors. Glycogen synthase makes alpha(1→4) linkages and branching enzyme introduces alpha(1→6) branches."]}},{"id":"concept-9-6","title":"Gluconeogenesis","section":"9.6","asset":"bc09-06","steps":[{"text":"Gluconeogenesis makes glucose from precursors such as lactate, glycerol and glucogenic amino acids. It is not a simple reversal of every glycolytic enzyme step.","focus":["part-0"]},{"text":"Pyruvate carboxylase and PEP carboxykinase bypass pyruvate kinase through oxaloacetate. Fructose-1,6-bisphosphatase and glucose-6-phosphatase bypass other strongly favorable glycolytic steps.","focus":["part-1"]},{"text":"Synthesis of one glucose from two pyruvates uses four ATP, two GTP and two NADH. Carbon source changes can alter the accounting required.","focus":["part-2"]},{"text":"Humans cannot obtain net glucose carbon from even-chain fatty-acid acetyl-CoA. Glycerol from triacylglycerol and propionyl-CoA from odd chains are different cases.","focus":["part-3"]}],"coreRule":{"title":"9.6 · Organize: Pyruvate carboxylase","paragraphs":["Gluconeogenesis makes glucose from precursors such as lactate, glycerol and glucogenic amino acids. It is not a simple reversal of every glycolytic enzyme step.","Pyruvate carboxylase and PEP carboxykinase bypass pyruvate kinase through oxaloacetate. Fructose-1,6-bisphosphatase and glucose-6-phosphatase bypass other strongly favorable glycolytic steps."]},"memoryCue":{"title":"9.6 · Bypass the irreversible steps; pay six nucleotide triphosphates.","paragraphs":["Bypass the irreversible steps; pay six nucleotide triphosphates.","Pyruvate carboxylase and PEP carboxykinase bypass pyruvate kinase through oxaloacetate. Fructose-1,6-bisphosphatase and glucose-6-phosphatase bypass other strongly favorable glycolytic steps."]},"traps":{"title":"9.6 · Check: Fructose bisphosphatase","paragraphs":["Synthesis of one glucose from two pyruvates uses four ATP, two GTP and two NADH. Carbon source changes can alter the accounting required.","Humans cannot obtain net glucose carbon from even-chain fatty-acid acetyl-CoA. Glycerol from triacylglycerol and propionyl-CoA from odd chains are different cases."]},"application":{"title":"9.6 · Apply: Glucose phosphatase","paragraphs":["Humans cannot obtain net glucose carbon from even-chain fatty-acid acetyl-CoA. Glycerol from triacylglycerol and propionyl-CoA from odd chains are different cases.","Gluconeogenesis makes glucose from precursors such as lactate, glycerol and glucogenic amino acids. It is not a simple reversal of every glycolytic enzyme step."]}},{"id":"concept-9-7","title":"The Pentose Phosphate Pathway","section":"9.7","asset":"bc09-07","steps":[{"text":"The pentose phosphate pathway branches from glucose-6-phosphate. Its oxidative phase generates NADPH and releases CO2; its nonoxidative phase rearranges sugar phosphates.","focus":["part-0"]},{"text":"NADPH supports reductive biosynthesis and regeneration of reduced glutathione. NADH more commonly supplies electrons for respiratory ATP production; the pools are functionally distinct.","focus":["part-1"]},{"text":"Ribose-5-phosphate supplies nucleotide synthesis. Depending on cellular needs, nonoxidative reactions can connect pentoses with glycolytic intermediates.","focus":["part-2"]},{"text":"Red blood cells rely on NADPH-dependent antioxidant defense. A pathway defect can increase oxidative vulnerability without implying that PPP directly produces ATP.","focus":["part-3"]}],"coreRule":{"title":"9.7 · Organize: Glucose-6-phosphate","paragraphs":["The pentose phosphate pathway branches from glucose-6-phosphate. Its oxidative phase generates NADPH and releases CO2; its nonoxidative phase rearranges sugar phosphates.","NADPH supports reductive biosynthesis and regeneration of reduced glutathione. NADH more commonly supplies electrons for respiratory ATP production; the pools are functionally distinct."]},"memoryCue":{"title":"9.7 · PPP supplies pentoses and NADPH, not direct ATP.","paragraphs":["PPP supplies pentoses and NADPH, not direct ATP.","NADPH supports reductive biosynthesis and regeneration of reduced glutathione. NADH more commonly supplies electrons for respiratory ATP production; the pools are functionally distinct."]},"traps swer":["part-1"],"explanation":"The relevant schematic entity or entities are Branching enzyme. Glycogen phosphorylase releases glucose-1-phosphate from nonreducing ends. A debranching enzyme handles branch regions that phosphorylase cannot fully resolve.","hints":["Identify the role named in the prompt before selecting a diagram entity.","Glycogen phosphorylase releases glucose-1-phosphate from nonreducing ends. A debranching enzyme handles branch regions that phosphorylase cannot fully resolve."]},{"id":"reason","type":"choice","prompt":"What is the main product directly released by glycogen phosphorylase?","answer":2,"options":["Free glucose only","Acetyl-CoA","Glucose-1-phosphate","Fructose-1,6-bisphosphate"],"explanation":"Glucose-1-phosphate. Glycogen phosphorylase releases glucose-1-phosphate from nonreducing ends. A debranching enzyme handles branch regions that phosphorylase cannot fully resolve.","hints":["Glycogenesis extends glycogen using activated glucose donors. Glycogen synthase makes alpha(1→4) linkages and branching enzyme introduces alpha(1→6) branches.","Glycogen phosphorylase releases glucose-1-phosphate from nonreducing ends. A debranching enzyme handles branch regions that phosphorylase cannot fully resolve."]},{"id":"transfer","type":"choice","prompt":"Why does muscle glycogen mainly support local use?","answer":3,"options":["Muscle has no glycolysis","Muscle glycogen contains no glucose","Only liver has ATP","Muscle lacks appreciable glucose-6-phosphatase for glucose export"],"explanation":"Muscle lacks appreciable glucose-6-phosphatase for glucose export. Liver glycogen supports blood glucose because liver can release free glucose. Skeletal muscle generally uses its glycogen locally and lacks appreciable glucose-6-phosphatase activity.","hints":["Glycogen phosphorylase releases glucose-1-phosphate from nonreducing ends. A debranching enzyme handles branch regions that phosphorylase cannot fully resolve.","Liver glycogen supports blood glucose because liver can release free glucose. Skeletal muscle generally uses its glycogen locally and lacks appreciable glucose-6-phosphatase activity."]}]},{"id":"bc-09-06-workshop-v1","title":"Gluconeogenesis","asset":"bc09-06","stages":[{"id":"map","type":"selection","prompt":"Select the enzyme that bypasses PFK-1 rather than pyruvate kinase.","answer":["part-2"],"explanation":"The relevant schematic entity or entities are Fructose bisphosphatase. Synthesis of one glucose from two pyruvates uses four ATP, two GTP and two NADH. Carbon source changes can alter the accounting required.","hints":["Identify the role named in the prompt before selecting a diagram entity.","Synthesis of one glucose from two pyruvates uses four ATP, two GTP and two NADH. Carbon source changes can alter the accounting required."]},{"id":"reason","type":"choice","prompt":"Which precursor can supply net glucose carbon in humans?","answer":3,"options":["Even-chain fatty-acid acetyl-CoA alone","Oxygen","Ketone bodies as the only carbon source","Glycerol"],"explanation":"Glycerol. Pyruvate carboxylase and PEP carboxykinase bypass pyruvate kinase through oxaloacetate. Fructose-1,6-bisphosphatase and glucose-6-phosphatase bypass other strongly favorable glycolytic steps.","hints":["Gluconeogenesis makes glucose from precursors such as lactate, glycerol and glucogenic amino acids. It is not a simple reversal of every glycolytic enzyme step.","Pyruvate carboxylase and PEP carboxykinase bypass pyruvate kinase through oxaloacetate. Fructose-1,6-bisphosphatase and glucose-6-phosphatase bypass other strongly favorable glycolytic steps."]},{"id":"transfer","type":"number","prompt":"How many ATP plus GTP molecules are consumed per glucose made from two pyruvates?","answer":6,"explanation":"6. Synthesis of one glucose from two pyruvates uses four ATP, two GTP and two NADH. Carbon source changes can alter the accounting required.","hints":["Pyruvate carboxylase and PEP carboxykinase bypass pyruvate kinase through oxaloacetate. Fructose-1,6-bisphosphatase and glucose-6-phosphatase bypass other strongly favorable glycolytic steps.","Synthesis of one glucose from two pyruvates uses four ATP, two GTP and two NADH. Carbon source changes can alter the accounting required."],"unit":"molecules","tolerance":0}]},{"id":"bc-09-07-workshop-v1","title":"The Pentose Phosphate Pathway","asset":"bc09-07","stages":[{"id":"map","type":"selection","prompt":"Select the product supporting reduced-glutathione regeneration.","answer":["part-2"],"explanation":"The relevant schematic entity or entities are NADPH. Ribose-5-phosphate supplies nucleotide synthesis. Depending on cellular needs, nonoxidative reactions can connect pentoses with glycolytic intermediates.","hints":["Identify the role named in the prompt before selecting a diagram entity.","Ribose-5-phosphate supplies nucleotide synthesis. Depending on cellular needs, nonoxidative reactions can connect pentoses with glycolytic intermediates."]},{"id":"reason","type":"choice","prompt":"Which reduced carrier is produced by the oxidative PPP?","answer":0,"options":["NADPH","NADH only","FADH2 only","ATP as its primary reduced carrier"],"explanation":"NADPH. NADPH supports reductive biosynthesis and regeneration of reduced glutathione. NADH more commonly supplies electrons for respiratory ATP production; the pools are functionally distinct.","hints":["The pentose phosphate pathway branches from glucose-6-phosphate. Its oxidative phase generates NADPH and releases CO2; its nonoxidative phase rearranges sugar phosphates.","NADPH supports reductive biosynthesis and regeneration of reduced glutathione. NADH more commonly supplies electrons for respiratory ATP production; the pools are functionally distinct."]},{"id":"transfer","type":"choice","prompt":"A cell needs ribose and reductive power. Which pathway serves both needs?","answer":1,"options":["Glycogen phosphorylysis alone","Pentose phosphate pathway","Beta oxidation alone","Urea cycle alone"],"explanation":"Pentose phosphate pathway. Ribose-5-phosphate supplies nucleotide synthesis. Depending on cellular needs, nonoxidative reactions can connect pentoses with glycolytic intermediates.","hints":["NADPH supports reductive biosynthesis and regeneration of reduced glutathione. NADH more commonly supplies electrons for respiratory ATP production; the pools are functionally distinct.","Ribose-5-phosphate supplies nucleotide synthesis. Depending on cellular needs, nonoxidative reactions can connect pentoses with glycolytic intermediates."]}]}]},{"version":1,"id":"chapter-10","title":"Carbohydrate Metabolism II: Aerobic Respiration","status":"implemented","scopeNote":"Original condensed MCAT biochemistry lessons covering the declared outline sections. This release is implemented, not independently scientifically verified; it is not exhaustive textbook coverage.","lessons":[{"id":"concept-10-1","title":"Acetyl-CoA","section":"10.1","asset":"bc10-01","steps":[{"text":"Acetyl-CoA carries an activated two-carbon acetyl unit. It can arise from pyruvate oxidation, fatty-acid oxidation and some amino-acid pathways.","focus":["part-0"]},{"text":"Citrate synthase combines acetyl-CoA with oxaloacetate to form citrate. Oxaloacetate is regenerated during the cycle, so its availability affects acetyl-unit oxidation.","focus":["part-1"]},{"text":"Acetyl-CoA is also a precursor for fatty-acid synthesis and ketone production in appropriate compartments and metabolic states. A branch-point metabolite has several possible fates.","focus":["part-2"]},{"text":"Human metabolism has no net conversion of acetyl-CoA carbon to glucose through the ordinary citric acid cycle. Regenerating oxaloacetate is not net synthesis of glucose carbon from acetyl units.","focus":["part-3"]}],"coreRule":{"title":"10.1 · Organize: Acetyl-CoA input","paragraphs":["Acetyl-CoA carries an activated two-carbon acetyl unit. It can arise from pyruvate oxidation, fatty-acid oxidation and some amino-acid p cus":["part-2"]},{"text":"The cycle supplies biosynthetic intermediates as well as reducing equivalents. Anaplerotic reactions replenish intermediates withdrawn for other uses.","focus":["part-3"]}],"coreRule":{"title":"10.2 · Organize: Citrate","paragraphs":["One cycle turn per acetyl-CoA produces three NADH, one FADH2 equivalent, one GTP or ATP and two CO2 while regenerating oxaloacetate.","Oxidative decarboxylations occur at isocitrate dehydrogenase and alpha-ketoglutarate dehydrogenase. Incoming acetyl carbons are not necessarily the first carbons released as CO2."]},"memoryCue":{"title":"10.2 · Per turn: three NADH, one FADH2 equivalent, one GTP, two CO2.","paragraphs":["Per turn: three NADH, one FADH2 equivalent, one GTP, two CO2.","Oxidative decarboxylations occur at isocitrate dehydrogenase and alpha-ketoglutarate dehydrogenase. Incoming acetyl carbons are not necessarily the first carbons released as CO2."]},"traps":{"title":"10.2 · Check: Succinate oxidation","paragraphs":["Succinate dehydrogenase is also respiratory complex II in the inner mitochondrial membrane. Most other cycle enzymes are in the mitochondrial matrix.","The cycle supplies biosynthetic intermediates as well as reducing equivalents. Anaplerotic reactions replenish intermediates withdrawn for other uses."]},"application":{"title":"10.2 · Apply: Oxaloacetate regeneration","paragraphs":["The cycle supplies biosynthetic intermediates as well as reducing equivalents. Anaplerotic reactions replenish intermediates withdrawn for other uses.","One cycle turn per acetyl-CoA produces three NADH, one FADH2 equivalent, one GTP or ATP and two CO2 while regenerating oxaloacetate."]}},{"id":"concept-10-3","title":"The Electron Transport Chain","section":"10.3","asset":"bc10-03","steps":[{"text":"Electrons from NADH enter at complex I; electrons associated with succinate oxidation enter at complex II. Ubiquinone and cytochrome c carry electrons between complexes.","focus":["part-0"]},{"text":"Complexes I,  enter at complex II. Ubiquinone and cytochrome c carry electrons between complexes."]}},{"id":"concept-10-4","title":"Oxidative Phosphorylation","section":"10.4","asset":"bc10-04","steps":[{"text":"Electron transfer establishes a proton-motive force across the inner mitochondrial membrane. Protons return toward the matrix through ATP synthase to support ATP production.","focus":["part-0"]},{"text":"An uncoupler dissipates the proton gradient without directly making ATP. When substrates and oxygen are available, respiration can increase even while ATP yield falls.","focus":["part-1"]},{"text":"An ATP-synthase inhibitor blocks productive proton return; respiratory electron flow often slows as the gradient builds. This differs from proton leakage through an uncoupler.","focus":["part-2"]},{"text":"Common ATP estimates use about 2.5 ATP per mitochondrial NADH and 1.5 per FADH2 equivalent, with assumptions. Whole-glucose yields vary with shuttles, transport costs and coupling.","focus":["part-3"]}],"coreRule":{"title":"10.4 · Organize: Proton gradient","paragraphs":["Electron transfer establishes a proton-motive force across the inner mitochondrial membrane. Protons return toward the matrix through ATP synthase to support ATP production.","An uncoupler dissipates the proton gradient without directly making ATP. When substrates and oxygen are available, respiration can increase even while ATP yield falls."]},"memoryCue":{"title":"10.4 · Leak the gradient: respiration can rise while ATP yield falls.","paragraphs":["Leak the gradient: respiration can rise while ATP yield falls.","An uncoupler dissipates the proton gradient without directly making ATP. When substrates and oxygen are available, respiration can increase even while ATP yield falls."]},"traps":{"title":"10.4 · Check: Uncoupler","paragraphs":["An ATP-synthase inhibitor blocks productive proton return; respiratory electron flow often slows as the gradient builds. This differs from proton leakage through an uncoup
