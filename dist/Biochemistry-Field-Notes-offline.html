title":"Lipid Digestion and Absorption","section":"11.1","asset":"bc11-01","steps":[{"text":"Bile salts help disperse dietary lipid and support mixed micelles. They assist access and solubilization; they are not the enzymes that hydrolyze ester bonds.","focus":["part-0"]},{"text":"Pancreatic lipase helps hydrolyze dietary triacylglycerol. Products enter enterocytes, where many long-chain fatty acids are reesterified.","focus":["part-1"]},{"text":"Long-chain dietary lipids leave enterocytes largely in chylomicrons through lymph before reaching blood. Micelles deliver material to the cell but do not become circulating chylomicrons intact.","focus":["part-2"]},{"text":"Shorter-chain fatty acids have different transport behavior and can reach portal blood more directly. Specify chain length before applying one route universally.","focus":["part-3"]}],"coreRule":{"title":"11.1 · Organize: Bile-assisted dispersion","paragraphs":["Bile salts help disperse dietary lipid and support mixed micelles. They assist access and solubilization; they are not the enzymes that hydrolyze ester bonds.","Pancreatic lipase helps hydrolyze dietary triacylglycerol. Products enter enterocytes, where many long-chain fatty acids are reesterified."]},"memoryCue":{"title":"11.1 · Micelles deliver to enterocytes; chylomicrons leave through lymph.","paragraphs":["Micelles deliver to enterocytes; chylomicrons leave through lymph.","Pancreatic lipase helps hydrolyze dietary triacylglycerol. Products enter enterocytes, where many long-chain fatty acids are reesterified."]},"traps":{"title":"11.1 · Check: Mixed micelle","paragraphs":["Long-chain dietary lipids leave enterocytes largely in chylomicrons through lymph before reaching blood. Micelles deliver material to the cell but do not become circulating chylomicrons intact.","Shorter-chain fatty acids have different transport behavior and can reach portal blood more directly. Specify chain length before applying one route universally."]},"application":{"title":"11.1 · Apply: Chylomicron export","paragraphs":["Shorter-chain fatty acids have different transport behavior and can reach portal blood more directly. Specify chain length before applying one route universally.","Bile salts help disperse dietary lipid and support mixed micelles. They assist access and solubilization; they are not the enzymes that hydrolyze ester bonds."]}},{"id":"concept-11-2","title":"Lipid Mobilization","section":"11.2","asset":"bc11-02","steps":[{"text":"Stored triacylglycerol is mobilized through a lipase sequence that releases fatty acids and glycerol. Several enzymes participate; no single lipase completes every step alone.","focus":["part-0"]},{"text":"Catecholamine signaling can promote adipose lipolysis, while insulin suppresses mobilization in the fed state. Human adipose regulation should not be reduced to a universal direct glucagon switch.","focus":["part-1"]},{"text":"Nonesterified fatty acids circulate largely bound to albumin. Glycerol is water-soluble and can be used especially by liver for metabolic pathways.","focus":["part-2"]},{"text":"Lipolysis releases fuel but does not itself oxidize every fatty acid to CO2. Uptake, activation and mitochondrial entry are separate control points.","focus":["part-3"]}],"coreRule":{"title":"11.2 · Organize: Adipose droplet","paragraphs":["Stored triacylglycerol is mobilized through a lipase sequence that releases fatty acids and glycerol. Several enzymes participate; no single lipase completes every step alone.","Catecholamine signaling can promote adipose lipolysis, while insulin suppresses mobilization in the fed state. Human adipose regulation should not be reduced to a universal direct glucagon switch."]},"memoryCue":{"title":"11.2 · Release is lipolysis; energy extraction is later oxidation.","paragraphs":["Release is lipolysis; energy extraction is later oxidation.","Catecholamine signaling can promote adipose lipolysis, while insulin suppresses mobilization in the fed state. Human adipose regulation should not be reduced to a universal direct glucagon switch."]},"traps":{"title":"11.2 · Check: Albumin carrier","paragraphs":["Nonesterified fatty acids circulate largely bound to albumin. Glycerol is water-soluble and can be used especially by liver for metabolic pathways.","Lipolysis releases fuel but does not itself oxidize every fatty acid to CO2. Uptake, activation and mitochondrial entry are separate control points."]},"application":{"title":"11.2 · Apply: Tissue uptake","paragraphs":["Lipolysis releases fuel but does not itself oxidize every fatty acid to CO2. Uptake, activation and mitochondrial entry are separate control points.","Stored triacylglycerol is mobilized through a lipase sequence that releases fatty acids and glycerol. Several enzymes participate; no single lipase completes every step alone."]}},{"id":"concept-11-3","title":"Lipid Transport","section":"11.3","asset":"bc11-03","steps":[{"text":"Lipoproteins package hydrophobic lipids within particles having a water-compatible surface. Their density depends on composition, including relative lipid and protein content.","focus":["part-0"]},{"text":"Chylomicrons carry much dietary triacylglycerol; VLDL exports much liver-derived triacylglycerol. Lipoprotein lipase helps tissues access fatty acids from circulating triacylglycerol.","focus":["part-1"]},{"text":"LDL supplies cholesterol to cells through receptor-mediated uptake. HDL participates in cholesterol transport and exchange, including reverse transport pathways.","focus":["part-2"]},{"text":"Particle roles are transport functions, not moral labels or a complete clinical risk model. Distinguish dietary lipid delivery from hepatic export and cholesterol retrieval.","focus":["part-3"]}],"coreRule":{"title":"11.3 · Organize: Chylomicron","paragraphs":["Lipoproteins package hydrophobic lipids within particles having a water-compatible surface. Their density depends on composition, including relative lipid and protein content.","Chylomicrons carry much dietary triacylglycerol; VLDL exports much liver-derived triacylglycerol. Lipoprotein lipase helps tissues access fatty acids from circulating triacylglycerol."]},"memoryCue":{"title":"11.3 · Chylomicrons carry diet; VLDL exports liver triacylglycerol.","paragraphs":["Chylomicrons carry diet; VLDL exports liver triacylglycerol.","Chylomicrons carry much dietary triacylglycerol; VLDL exports much liver-derived triacylglycerol. Lipoprotein lipase helps tissues access fatty acids from circulating triacylglycerol."]},"traps":{"title":"11.3 · Check: LDL","paragraphs":["LDL supplies cholesterol to cells through receptor-mediated uptake. HDL participates in cholesterol transport and exchange, including reverse transport pathways.","Particle roles are transport functions, not moral labels or a complete clinical risk model. Distinguish dietary lipid delivery from hepatic export and cholesterol retrieval."]},"application":{"title":"11.3 · Apply: HDL","paragraphs":["Particle roles are transport functions, not moral labels or a complete clinical risk model. Distinguish dietary lipid delivery from hepatic export and cholesterol retrieval.","Lipoproteins package hydrophobic lipids within particles having a water-compatible surface. Their density depends on composition, including relative lipid and protein content."]}},{"id":"concept-11-4","title":"Cholesterol Metabolism","section":"11.4","asset":"bc11-04","steps":[{"text":"Cholesterol is synthesized from acetyl-derived carbon through a multistep pathway. HMG-CoA reductase is an important regulated step in the mevalonate pathway.","focus":["part-0"]},{"text":"Cholesterol supports membranes and is a precursor for steroid hormones and bile acids. Cholesterol synthesis and mitochondrial ketogenesis use different compartmental pathways despite sharing an HMG-CoA intermediate name.","focus":["part-1"]},{"text":"Feedback and enzyme regulation restrain synthesis when sterol supply is high. Uptake, synthesis, storage and disposal all contribute to the cellular cholesterol pool.","focus":["part-2"]},{"text":"Human cholesterol carbon is not simply oxidized to CO2 as a major fuel route. Conversion to bile acids and biliary secretion contribute to elimination.","focus":["part-3"]}],"coreRule":{"title":"11.4 · Organize: HMG-CoA reductase","paragraphs":["Cholesterol is synthesized from acetyl-derived carbon through a multistep pathway. HMG-CoA reductase is an important regulated step in the mevalonate pathway.","Cholesterol supports membranes and is a precursor for steroid hormones and bile acids. Cholesterol synthesis and mitochondrial ketogenesis use different compartmental pathways despite sharing an HMG-CoA intermediate name."]},"memoryCue":{"title":"11.4 · Cholesterol feeds membranes, steroids and bile acids.","paragraphs":["Cholesterol feeds membranes, steroids and bile acids.","Cholesterol supports membranes and is a precursor for steroid hormones and bile acids. Cholesterol synthesis and mitochondrial ketogenesis use different compartmental pathways despite sharing an HMG-CoA intermediate name."]},"traps":{"title":"11.4 · Check: Bile acids","paragraphs":["Feedback and enzyme regulation restrain synthesis when sterol supply is high. Uptake, synthesis, storage and disposal all contribute to the cellular cholesterol pool.","Human cholesterol carbon is not simply oxidized to CO2 as a major fuel route. Conversion to bile acids and biliary secretion contribute to elimination."]},"application":{"title":"11.4 · Apply: Steroid products","paragraphs":["Human cholesterol carbon is not simply oxidized to CO2 as a major fuel route. Conversion to bile acids and biliary secretion contribute to elimination.","Cholesterol is synthesized from acetyl-derived carbon through a multistep pathway. HMG-CoA reductase is an important regulated step in the mevalonate pathway."]}},{"id":"concept-11-5","title":"Fatty Acids and Triacylglycerols","section":"11.5","asset":"bc11-05","steps":[{"text":"F d processing and have different energy accounting."]},"application":{"title":"11.5 · Apply: Malonyl-CoA signal","paragraphs":["Odd-chain oxidation ends with propionyl-CoA, which can enter metabolism through succinyl-CoA. Unsaturated chains require modified processing and have different energy accounting.","Fatty-acid synthesis uses cytosolic acetyl-derived units and NADPH, with malonyl-CoA serving as a two-carbon donor after decarboxylation. Synthesis is not reverse beta oxidation."]}},{"id":"concept-11-6","title":"Ketone Bodies","section":"11.6","asset":"bc11-06","steps":[{"text":"Liver mitochondria make ketone bodies from acetyl-CoA, especially when fatty-acid supply is high and carbohydrate availability is low. Ketones are exported as water-soluble fuels.","focus":["part-0"]},{"text":"Extrahepatic tissues with appropriate mitochondrial enzymes can use ketones. Liver lacks the usual SCOT-mediated route for consuming the ketones it produces.","focus":["part-1"]},{"text":"The brain can increase ketone use during prolonged fasting. Mature red blood cells cannot use ketones for mitochondrial ATP production because they lack mitochondria.","focus":["part-2"]},{"text":"Ketone production is not inherently equivalent to a pathological acid-base disturbance. The magnitude of production, utilization and acid-base compensation matters.","focus":["part-3"]}],"coreRule":{"title":"11.6 · Organize: Hepatic ketogenesis","paragraphs":["Liver mitochondria make ketone bodies from acetyl-CoA, especially when fatty-acid supply is high and carbohydrate availability is low. Ketones are exported as water-soluble fuels.","Extrahepatic tissues with appropriate mitochondrial enzymes can use ketones. Liver lacks the usual SCOT-mediated route for consuming the ketones it produces."]},"memoryCue":{"title":"11.6 · Liver makes ketones; other suitable mitochondria use them.","paragraphs":["Liver makes ketones; other suitable mitochondria use them.","Extrahepatic tissues with appropriate mitochondrial enzymes can use ketones. Liver lacks the usual SCOT-mediated route for consuming the ketones it produces."]},"traps":{"title":"11.6 · Check: Extrahepatic use","paragraphs":["The brain can increase ketone use during prolonged fasting. Mature red blood cells cannot use ketones for mitochondrial ATP production because they lack mitochondria.","Ketone production is not inherently equivalent to a pathological acid-base disturbance. The magnitude of production, utilization and acid-base compensation matters."]},"application":{"title":"11.6 · Apply: Acetyl-CoA recovery","paragraphs":["Ketone production is not inherently equivalent to a pathological acid-base disturbance. The magnitude of production, utilization and acid-base compensation matters.","Liver mitochondria make ketone bodies from acetyl-CoA, especially when fatty-acid supply is high and carbohydrate availability is low. Ketones are exported as water-soluble fuels."]}},{"id":"concept-11-7","title":"Protein Catabolism","section":"11.7","asset":"bc11-07","steps":[{"text":"Amino-acid catabolism separates nitrogen handling from carbon-skeleton metabolism. Transamination commonly transfers an amino group to an alpha-keto acid using PLP-dependent enzymes.","focus":["part-0"]},{"text":"Glutamate and glutamine play major nitrogen-collection and transport roles. Free ammonia must be controlled because excess is toxic.","focus":["part-1"]},{"text":"The hepatic urea cycle disposes of nitrogen using mitochondrial and cytosolic steps. Its nitrogen atoms arise from ammonia and aspartate, and it consumes high-energy phosphate bonds.","focus":["part-2"]},{"text":"Glucogenic skeletons can support net glucose synthesis; ketogenic skeletons supply acetyl-CoA or related products. Leucine and lysine are exclusively ketogenic in the standard classification.","focus":["part-3"]}],"coreRule":{"title":"11.7 · Organize: Transamination","paragraphs":["Amino-acid catabolism separates nitrogen handling from carbon-skeleton metabolism. T en using mitochondrial and cytosolic steps. Its nitrogen atoms arise from ammonia and aspartate, and it consumes high-energy phosphate bonds."]},{"id":"reason","type":"choice","prompt":"Which coenzyme is central to many aminotransferases?","answer":2,"options":["Coenzyme Q only","Biotin in every case","PLP","Retinal"],"explanation":"PLP. Glutamate and glutamine play major nitrogen-collection and transport roles. Free ammonia must be controlled because excess is toxic.","hints":["Amino-acid catabolism separates nitrogen handling from carbon-skeleton metabolism. Transamination commonly transfers an amino group to an alpha-keto acid using PLP-dependent enzymes.","Glutamate and glutamine play major nitrogen-collection and transport roles. Free ammonia must be controlled because excess is toxic."]},{"id":"transfer","type":"choice","prompt":"Which pair is exclusively ketogenic in the standard human classification?","answer":3,"options":["Alanine and glycine","Aspartate and glutamate","Serine and cysteine","Leucine and lysine"],"explanation":"Leucine and lysine. The hepatic urea cycle disposes of nitrogen using mitochondrial and cytosolic steps. Its nitrogen atoms arise from ammonia and aspartate, and it consumes high-energy phosphate bonds.","hints":["Glutamate and glutamine play major nitrogen-collection and transport roles. Free ammonia must be controlled because excess is toxic.","The hepatic urea cycle disposes of nitrogen using mitochondrial and cytosolic steps. Its nitrogen atoms arise from ammonia and aspartate, and it consumes high-energy phosphate bonds."]}]}]},{"version":1,"id":"chapter-12","title":"Bioenergetics and Regulation of Metabolism","status":"implemented","scopeNote":"Original condensed MCAT biochemistry lessons covering the declared outline sections. This release is implemented, not independently scientifically verified; it is not exhaustive textbook coverage.","lessons":[{"id":"concept-12-1","title":"Thermodynamics and Bioenergetics","section":"12.1","asset":"bc12-01","steps":[{"text":"For a defined reaction, actual free energy depends on composition: ΔG = ΔG°′ + RT ln Q under a consistent biochemical standard-state convention.","focus":["part-0"]},{"text":"A negative actual ΔG favors the written forward direction under the stated conditions. A negative standard value alone does not determine direction at every concentration.","focus":["part-1"]},{"text":"At equilibrium, actual ΔG is zero and the reaction quotient equals the equilibrium constant. Zero net flux does not require molecular motion or exchange to stop.","focus":["part-2"]},{"text":"Coupled reaction free energies add when stoichiometries are combined correctly. Thermodynamic favorability does not specify how quickly the process occurs.","focus":["part-3"]}],"coreRule":{"title":"12.1 · Organize: Standard free energy","paragraphs":["For a defined reaction, actual free energy depends on composition: ΔG = ΔG°′ + RT ln Q under a consistent biochemical standard-state convention.","A negative actual ΔG favors the written forward direction under the stated conditions. A negative standard value alone does not determine direction at every concentration."]},"memoryCue":{"title":"12.1 · Actual direction needs actual composition, not just a standard value.","paragraphs":["Actual direction needs actual composition, not just a standard value.","A negative actual ΔG favors the written forward direction under the stated conditions. A negative standard value alone does not determine direction at every concentration."]},"traps":{"title":"12.1 · Check: Actual free energy","paragraphs":["At equilibrium, actual ΔG is zero and the reaction quotient equals the equilibrium constant. Zero net flux does not require molecular motion or exchange to stop.","Coupled reaction free energies add when stoichiometries are combined correctly. Thermodynamic favorability does not specify how quickly the process occurs."]},"application":{"title":"12.1 · Apply: Equilibrium","paragraphs":["Coupled reaction free energies add when stoichiometries are combined correctly. Thermodynamic favorability does not specify how quickly the process occurs.","For a defined reaction, actual free energy depends on composition: ΔG = ΔG°′ + RT ln Q under a consistent biochemical standard-state convention."]}},{"id":"concept-12-2","title":"The Role of ATP","section":"12.2","asset":"bc12-02","steps":[{"text":"ATP hydrolysis can be coupled to otherwise unfavorable processes through a shared intermediate or molecular mechanism. Merely putting two unrelated reactions together does not guarantee coupling.","focus":["part-0"]},{"text":"Favorable hydrolysis reflects the free-energy balance between reactants and products, including resonance, solvation and charge effects. Breaking a bond itself requires energy.","focus":["part-1"]},{"text":"ATP to ADP and phosphate differs from ATP to AMP and pyrophosphate. Subsequent pyrophosphate hydrolysis can help drive biosynthetic activation steps.","focus":["part-2"]},{"text":"ATP is regenerated continuously and is an energy-transfer currency. It is not the principal long-term mass storage form of fuel in the body.","focus":["part-3"]}],"coreRule":{"title":"12.2 · Organize: ATP hydrolysis","paragraphs":["ATP hydrolysis can be coupled to otherwise unfavorable processes through a shared intermediate or molecular mechanism. Merely putting two unrelated reactions together does not guarantee coupling.","Favorable hydrolysis reflects the free-energy balance between reactants and products, including resonance, solvation and charge effects. Breaking a bond itself requires energy."]},"memoryCue":{"title":"12.2 · Count the whole reaction; bond breaking alone costs energy.","paragraphs":["Count the whole reaction; bond breaking alone costs energy.","Favorable hydrolysis reflects the free-energy balance between reactants and products, including resonance, solvation and charge effects. Breaking a bond itself requires energy."]},"traps":{"title":"12.2 · Check: Phosphoryl transfer","paragraphs":["ATP to ADP and phosphate differs from ATP to AMP and pyrophosphate. Subsequent pyrophosphate hydrolysis can help drive biosynthetic activation steps.","ATP is regenerated continuously and is an energy-transfer currency. It is not the principal long-term mass storage form of fuel in the body."]},"application":{"title":"12.2 · Apply: Cellular work","paragraphs":["ATP is regenerated continuously and is an energy-transfer currency. It is not the principal long-term mass storage form of fuel in the body.","ATP hydrolysis can be coupled to otherwise unfavorable processes through a shared intermediate or molecular mechanism. Merely putting two unrelated reactions together does not guarantee coupling."]}},{"id":"concept-12-3","title":"Biological Oxidation and Reduction","section":"12.3","asset":"bc12-03","steps":[{"text":"Oxidation is loss of electrons and reduction is gain. An oxidizing agent accepts electrons and is itself reduced; a reducing agent donates electrons and is itself oxidized.","focus":["part-0"]},{"text":"NADH commonly transfers electrons from fuel oxidation to respiration. NADPH commonly supports reductive biosynthesis and antioxidant systems.","focus":["part-1"]},{"text":"For a redox reaction, ΔG°′ = −nFΔE°′ under consistent conventions. A positive acceptor-minus-donor reduction-potential difference favors the written electron transfer.","focus":["part-2"]},{"text":"Redox couples have distinct concentrations and compartmental pools. The presence of a reduced carrier does not prove every pathway in the cell is running in the same direction.","focus":["part-3"]}],"coreRule":{"title":"12.3 · Organize: Electron donor","paragraphs":["Oxidation is loss of electrons and reduction is gain. An oxidizing agent accepts electrons and is itself reduced; a reducing agent donates electrons and is itself oxidized.","NADH commonly transfers electrons from fuel oxidation to respiration. NADPH commonly supports reductive biosynthesis and antioxidant systems."]},"memoryCue":{"title":"12.3 · OIL RIG: oxidation loses electrons, reduction gains electrons.","paragraphs":["OIL RIG: oxidation loses electrons, reduction gains electrons.","NADH commonly transfers electrons from fuel oxidation to respiration. NADPH commonly supports reductive biosynthesis and antioxidant systems."]},"traps":{"title":"12.3 · Check: NADH pool","paragraphs":["For a redox reaction, ΔG°′ = −nFΔE°′ under consistent conventions. A positive acceptor-minus-donor reduction-potential difference favors the written electron transfer.","Redox couples have distinct concentrations and compartmental pools. The presence of a reduced carrier does not prove every pathway in the cell is running in the same direction."]},"application":{"title":"12.3 · Apply: NADPH pool","paragraphs":["Redox couples have distinct concentrations and compartmental pools. The presence of a reduced carrier does not prove every pathway in the cell is running in the same direction.","Oxidation is loss of electrons and reduction is gain. An oxidizing agent accepts electrons and is itself reduced; a reducing agent donates electrons and is itself oxidized."]}},{"id":"concept-12-4","title":"Metabolic States","section":"12.4","asset":"bc12-04","steps":[{"text":"After a mixed meal, insulin tends to favor nutrient uptake and storage. During fasting, hormonal and substrate changes favor mobilization and maintenance of blood glucose.","focus":["part-0"]},{"text":"Early fasting draws on hepatic glycogen and gluconeogenesis. As glycogen becomes depleted, gluconeogenesis and increasing ketone availability become more important.","focus":["part-1"]},{"text":"Tissues adapt differently: muscle can use fatty acids, while red blood cells continue to require glycolysis. The brain can use more ketones during prolonged fasting but still has glucose needs.","focus":["part-2"]},{"text":"Time boundaries vary with prior diet, activity and physiology. These state labels describe trends, not exact universal hourly cutoffs.","focus":["part-3"]}],"coreRule":{"title":"12.4 · Organize: Fed state","paragraphs":["After a mixed meal, insulin tends to favor nutrient uptake and storage. During fasting, hormonal and substrate changes favor mobilization and maintenance of blood glucose.","Early fasting draws on hepatic glycogen and gluconeogenesis. As glycogen becomes depleted, gluconeogenesis and increasing ketone availability become more important."]},"memoryCue":{"title":"12.4 · Fasting shifts fuels with time and tissue.","paragraphs":["Fasting shifts fuels with time and tissue.","Early fasting draws on hepatic glycogen and gluconeogenesis. As glycogen becomes depleted, gluconeogenesis and increasing ketone availability become more important."]},"traps":{"title":"12.4 · Check: Long fasting","paragraphs":["Tissues adapt differently: muscle can use fatty acids, while red blood cells continue to require glycolysis. The brain can use more ketones during prolonged fasting but still has glucose needs.","Time boundaries vary with prior diet, activity and physiology. These state labels describe trends, not exact universal hourly cutoffs."]},"application":{"title":"12.4 · Apply: Fuel adaptation","paragraphs":["Time boundaries vary with prior diet, activity and physiology. These state labels describe trends, not exact universal hourly cutoffs.","After a mixed meal, insulin tends to favor nutrient uptake and storage. During fasting, hormonal and substrate changes favor mobilization and maintenance of blood glucose."]}},{"id":"concept-12-5","title":"Hormonal Regulation of Metabolism","section":"12.5","asset":"bc12-05","steps":[{"text":"Insulin generally coordinates fed-state uptake and storage, including muscle and adipose GLUT4 recruitment and promotion of glycogen synthesis.","focus":["part-0"]},{"text":"Glucagon chiefly signals hepatic fasting responses through cAMP-linked pathways. Skeletal muscle does not respond to glucagon with the same direct glycogen-mobilizing mechanism.","focus":["part-1"]},{"text":"Epinephrine supports rapid fuel mobilization, including muscle glycogen breakdown. Hormone effects depend on receptor expression and tissue-specific signaling.","focus":["part-2"]},{"text":"Phosphorylation activates some targets and inhibits others. Infer the net pathway response using the named enzyme rather than treating every phosphorylation as activation.","focus":["part-3"]}],"coreRule":{"title":"12.5 · Organize: Insulin","paragraphs":["Insulin generally coordinates fed-state uptake and storage, including muscle and adipose GLUT4 recruitment and promotion of glycogen synthesis.","Glucagon chiefly signals hepatic fasting responses through cAMP-linked pathways. Skeletal muscle does not respond to glucagon with the same direct glycogen-mobilizing mechanism."]},"memoryCue":{"title":"12.5 · A hormone needs the right receptor and tissue machinery.","paragraphs":["A hormone needs the right receptor and tissue machinery.","Glucagon chiefly signals hepatic fasting responses through cAMP-linked pathways. Skeletal muscle does not respond to glucagon with the same direct glycogen-mobilizing mechanism."]},"traps":{"title":"12.5 · Check: Epinephrine","paragraphs":["Epinephrine supports rapid fuel mobilization, including muscle glycogen breakdown. Hormone effects depend on receptor expression and tissue-specific signaling.","Phosphorylation activates some targets and inhibits others. Infer the net pathway response using the named enzyme rather than treating every phosphorylation as activation."]},"application":{"title":"12.5 · Apply: Target enzymes","paragraphs":["Phosphorylation activates some targets and inhibits others. Infer the net pathway response using the named enzyme rather than treating every phosphorylation as activation.","Insulin generally coordinates fed-state uptake and storage, including muscle and adipose GLUT4 recruitment and promotion of glycogen synthesis."]}},{"id":"concept-12-6","title":"Tissue-Specific Metabolism","section":"12.6","asset":"bc12-06","steps":[{"text":"Liver buffers circulating fuel supply through storage, glucose production and ketone production, depending on state. It is not simply a duplicate of skeletal muscle metabolism.","focus":["part-0"]},{"text":"Skeletal muscle uses its own glycogen and can oxidize fatty acids. Its net fuel choice changes with exercise intensity, substrate availability and hormonal state.","focus":["part-1"]},{"text":"The brain normally relies heavily on glucose and can use ketones during prolonged fasting. Long-chain fatty acids are not its major routine oxidative fuel.","focus":["part-2"]},{"text":"Mature human red blood cells lack mitochondria, so they obtain ATP through glycolysis and produce lactate. They cannot perform mitochondrial beta oxidation or oxidative phosphorylation.","focus":["part-3"]}],"coreRule":{"title":"12.6 · Organize: Liver","paragraphs":["Liver buffers circulating fuel supply through storage, glucose production and ketone production, depending on state. It is not simply a duplicate of skeletal muscle metabolism.","Skeletal muscle uses its own glycogen and can oxidize fatty acids. Its net fuel choice changes with exercise intensity, substrate availability and hormonal state."]},"memoryCue":{"title":"12.6 · Red cells lack mitochondria; liver can support blood glucose.","paragraphs":["Red cells lack mitochondria; liver can support blood glucose.","Skeletal muscle uses its own glycogen and can oxidize fatty acids. Its net fuel choice changes with exercise intensity, substrate availability and hormonal state."]},"traps":{"title":"12.6 · Check: Brain","paragraphs":["The brain normally relies heavily on glucose and can use ketones during prolonged fasting. Long-chain fatty acids are not its major routine oxidative fuel.","Mature human red blood cells lack mitochondria, so they obtain ATP through glycolysis and produce lactate. They cannot perform mitochondrial beta oxidation or oxidative phosphorylation."]},"application":{"title":"12.6 · Apply: Red blood cell","paragraphs":["Mature human red blood cells lack mitochondria, so they obtain ATP through glycolysis and produce lactate. They cannot perform mitochondrial beta oxidation or oxidative phosphorylation.","Liver buffers circulating fuel supply through storage, glucose production and ketone production, depending on state. It is not simply a duplicate of skeletal muscle metabolism."]}},{"id":"concept-12-7","title":"Integrative Metabolism","section":"12.7","asset":"bc12-07","steps":[{"text":"In the Cori cycle, lactate produced by tissues such as exercising muscle or red blood cells reaches liver and can supply gluconeogenesis. Glucose can then return to peripheral tissues.","focus":["part-0"]},{"text":"Liver glucose synthesis from lactate consumes energy, whereas peripheral glycolysis yields ATP. The cycle redistributes fuel and metabolic work rather than generating free energy for the body.","focus":["part-1"]},{"text":"The glucose–alanine cycle transfers both carbon and nitrogen from muscle toward liver. Nitrogen disposal and carbon recycling must be accounted for separately.","focus":["part-2"]},{"text":"Integrated metabolism requires tissue, compartment, hormone and substrate context. For a perturbation, follow carbon, electrons and ATP costs separately before predicting whole-body effects.","focus":["part-3"]}],"coreRule":{"title":"12.7 · Organize: Muscle lactate","paragraphs":["In the Cori cycle, lactate produced by tissues such as exercising muscle or red blood cells reaches liver and can supply gluconeogenesis. Glucose can then return to peripheral tissues.","Liver glucose synthesis from lactate consumes energy, whereas peripheral glycolysis yields ATP. The cycle redistributes fuel and metabolic work rather than generating free energy for the body."]},"memoryCue":{"title":"12.7 · Cori recycles carbon while liver pays the energy bill.","paragraphs":["Cori recycles carbon while liver pays the energy bill.","Liver glucose synthesis from lactate consumes energy, whereas peripheral glycolysis yields ATP. The cycle redistributes fuel and metabolic work rather than generating free energy for the body."]},"traps":{"title":"12.7 · Check: Adipose fatty acids","paragraphs":["The glucose–alanine cycle transfers both carbon and nitrogen from muscle toward liver. Nitrogen disposal and carbon recycling must be accounted for separately.","Integrated metabolism requires tissue, compartment, hormone and substrate context. For a perturbation, follow carbon, electrons and ATP costs separately before predicting whole-body effects."]},"application":{"title":"12.7 · Apply: Whole-body balance","paragraphs":["Integrated metabolism requires tissue, compartment, hormone and substrate context. For a perturbation, follow carbon, electrons and ATP costs separately before predicting whole-body effects.","In the Cori cycle, lactate produced by tissues such as exercising muscle or red blood cells reaches liver and can supply gluconeogenesis. Glucose can then return to peripheral tissues."]}}],"exercises":[{"id":"bc-12-01-workshop-v1","title":"Thermodynamics and Bioenergetics","asset":"bc12-01","stages":[{"id":"map","type":"selection","prompt":"Select the composition-dependent term entering the free-energy equation.","answer":["part-1"],"explanation":"The relevant schematic entity or entities are Reaction quotient. A negative actual ΔG favors the written forward direction under the stated conditions. A negative standard value alone does not determine direction at every concentration.","hints":["Identify the role named in the prompt before selecting a diagram entity.","A negative actual ΔG favors the written forward direction under the stated conditions. A negative standard value alone does not determine direction at every concentration."]},{"id":"reason","type":"choice","prompt":"At equilibrium, what is the actual ΔG?","answer":1,"options":["Always highly negative","Zero","Always highly positive","Equal to activ function diagram(asset,focus=[],selection=false,chosen=[],teaching=false,motion=true){
 const e=escapeHtml;const illustration=biochemicalSvg(asset,focus,chosen,false,teaching?'explore':selection?'select':false);if(illustration){const animated=/class="[^"]*\b(flow|breath|diaphragm-motion|separate-left|thin-left)\b/.test(illustration);const legend=`<ul class="diagram-key">${asset.nodes.map(n=>`<li class="${focus.includes(n.id)?'key-active':''}">${e(n.label)}</li>`).join('')}</ul>`;return `<figure class="biochemistry-figure" data-playing="${teaching&&motion&&animated}" data-visual="${e(asset.visual.type)}">${illustration}${legend}<figcaption>${e(asset.context)}</figcaption>${teaching&&animated?`<div class="visual-controls"><button data-action="playVisual" ${motion?'':'disabled'} aria-pressed="${motion}">${motion?'Pause process':'Motion reduced'}</button><button data-action="replayVisual" ${motion?'':'disabled'}>Replay process</button><span>Process overview · Select a structure or use lesson steps.</span></div>`:''}</figure>${selection?`<div class="choices" role="group" aria-label="Select diagram entities">${asset.nodes.map(n=>`<button data-node="${e(n.id)}" aria-pressed="${chosen.includes(n.id)}">${e(n.label)}</button>`).join('')}</div>`:''}`;}const nodes=Object.fromEntries(asset.nodes.map(n=>[n.id,n]));
 const lines=asset.edges.map(edge=>{const a=nodes[edge.from],b=nodes[edge.to],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),offset=Math.min(92/Math.abs(dx),31/Math.abs(dy))*d;return `<line x1="${a.x+dx/d*offset}" y1="${a.y+dy/d*offset}" x2="${b.x-dx/d*offset}" y2="${b.y-dy/d*offset}" marker-end="url(#arrow)"/>`;}).join('');
 return `<figure><svg viewBox="0 0 400 230" role="img" aria-label="${e(asset.title)}"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6"/></marker></defs>${lines}${asset.nodes.map(n=>`<g class="entity ${focus.includes(n.id)?'focus':''} ${chosen.includes(n.id)?'selected':''}"><rect x="${n.x-86}" y="${n.y-25}" width="172" height="50" rx="9"/><text x="${n.x}" y="${n.y+5}" text-anchor="middle">${e(n.label)}</text></g>`).join('')}</svg><figcaption>${e(asset.context)}</figcaption></figure>${selection?`<div class="choices" role="group" aria-label="Select diagram entities">${asset.nodes.map(n=>`<button data-node="${e(n.id)}" aria-pressed="${chosen.includes(n.id)}">${e(n.label)}</button>`).join('')}</div>`:''}`;
}

return {escapeHtml,diagram};})();
__modules.learn=(()=>{
const {diagram,escapeHtml:e}=__modules.diagram;
function teachingCards(lesson){return `<aside class="tstack teaching-cards" aria-label="Concept teaching cards">${[['coreRule','Core Rules','rule'],['memoryCue','Memory Cues','cue'],['traps','Common Mistakes / MCAT Traps','trap'],['application','MCAT Applications','app']].map(([key,label,type])=>{const card=lesson[key];return `<details class="tcard tc-${type}" data-card="${key}" ${type==='rule'?'open':''}><summary><span class="card-heading"><h3>${label}</h3><span class="card-hook">${e(card.title)}</span></span></summary><div class="card-body">${card.paragraphs.map(p=>`<p>${e(p)}</p>`).join('')}</div></details>`;}).join('')}<button class="practice-concept" data-action="practiceConcept">Practice this concept →</button></aside>`;}
function learnView(chapter,assets,index,step,options={}){const l=chapter.lessons[index];return `<nav class="cnav" aria-label="Concepts">${chapter.lessons.map((x,i)=>`<button class="cbtn" data-lesson="${i}" aria-pressed="${i===index}">${e(x.title)}</button>`).join('')}</nav><div class="grid2"><section class="card"><h2>${e(l.title)}</h2><p>Outline section ${e(l.section)} · Step ${step+1} of ${l.steps.length}</p>${diagram(assets[l.asset],l.steps[step].focus,false,[],true,options.motion!==false)}<p class="step" aria-live="polite">${e(l.steps[step].text)}</p><div class="actions"><button data-action="previous" ${step===0?'disabled':''}>Previous step</button><button data-action="next" ${step===l.steps.length-1?'disabled':''}>Next step</button></div></section>${teachingCards(l)}</div>`;}

return {teachingCards,learnView};})();
__modules.practice=(()=>{
const {diagram,escapeHtml:e}=__modules.diagram;
function stageKey(exercise,stage){return exercise.id+'/'+stage.id;}
function practiceView(chapter,assets,index,stageIndex,state,chosen,feedback){
 const ex=chapter.exercises[index],s=ex.stages[stageIndex],key=stageKey(ex,s),record=state.stages[key]||{},done=record.done===true;
 const options=s.type==='choice'?`<fieldset><legend>Choose one answer</legend>${s.options.map((o,i)=>`<label class="option"><input type="radio" name="answer" value="${i}" ${done?'disabled':''}> ${e(o)}</label>`).join('')}</fieldset>`:s.type==='selection'?'':`<label for="answer">Answer${s.unit?' ('+e(s.unit)+')':''}</label><input id="answer" name="answer" autocomplete="off" ${s.type==='number'?'inputmode="decimal"':''} ${done?'disabled':''}>`;
 const answer=s.type==='choice'?s.options[s.answer]:s.type==='selection'?s.answer.map(id=>assets[s.asset||ex.asset].nodes.find(n=>n.id===id).label).join(', '):s.answer+(s.unit&&s.unit!=='dimensionless'?' '+s.unit:'');
 return `<nav class="cnav" aria-label="Workshops">${chapter.exercises.map((x,i)=>`<button class="cbtn" data-exercise="${i}" aria-pressed="${i===index}">${e(x.title)}</button>`).join('')}</nav><section class="card practice"><h2>${e(ex.title)}</h2><p>Stage ${stageIndex+1} of ${ex.stages.length}</p><h3 id="question">${e(s.prompt)}</h3>${diagram(assets[s.asset||ex.asset],[],s.type==='selection'&&!done,chosen)}<form id="answer-form" aria-labelledby="question">${options}${done?'':`<button type="submit">Check answer</button>`}</form><p id="feedback" role="status" class="${done?'completed':''}">${e(done?(record.assisted?'Completed with assistance.':'Independently solved.') : feedback)}</p>${Array.from({length:record.hints||0},(_,i)=>`<p class="hint">Hint ${i+1}: ${e(s.hints[i])}</p>`).join('')}${done?`<div class="solution"><p><strong>Answer: ${e(answer)}</strong></p><p>${e(s.explanation)}</p></div><button data-action="advance">${stageIndex+1<ex.stages.length?'Next stage':'Restart workshop'}</button>`:`<div class="actions"><button data-action="hint" ${(record.hints||0)>=s.hints.length?'disabled':''}>Progressive hint</button><button data-action="reveal">Reveal answer (assisted)</button></div>`}</section>`;
}

return {stageKey,practiceView};})();
__modules.app=(()=>{
const {validateAnswer}=__modules.validation;
const {fresh,readProgress,writeProgress,sanitize}=__modules.progress;
const {escapeHtml:e}=__modules.diagram;
const {learnView}=__modules.learn;
const {practiceView,stageKey}=__modules.practice;
const data=JSON.parse(document.getElementById('biochemistry-data').textContent),assets=Object.fromEntries(data.assets.assets.map(a=>[a.id,a]));
let chapter=data.chapters[0];
const ids=new Set(data.chapters.flatMap(c=>c.exercises.flatMap(ex=>ex.stages.map(s=>stageKey(ex,s)))));
let storage;try{storage=window.localStorage;}catch{storage={getItem(){throw Error();},setItem(){throw Error();}};}
let loaded=readProgress(storage,ids),state=loaded.state,warning=loaded.warning,mode='learn',lesson=0,step=0,exercise=0,stage=0,chosen=[],feedback='';
const view=document.getElementById('view');
function current(){const ex=chapter.exercises[exercise],s=ex.stages[stage];return {ex,s,key:stageKey(ex,s)};}
function save(){warning=writeProgress(storage,state)||warning;}
function render(){const active=document.activeElement;const action=active?.closest('#view')?active.dataset.action:undefined;document.documentElement.dataset.theme=state.theme;document.documentElement.classList.toggle('no-motion',state.reduced);document.body.classList.toggle('dark',state.theme==='dark');
 document.getElementById('warning').textContent=warning;
 document.getElementById('theme').setAttribute('aria-pressed',state.theme==='dark');document.getElementById('motion').setAttribute('aria-pressed',state.reduced);
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-current',b.dataset.mode===mode?'page':'false'));
 const chapterIds=new Set(chapter.exercises.flatMap(ex=>ex.stages.map(s=>stageKey(ex,s))));const records=Object.entries(state.stages).filter(([id])=>chapterIds.has(id)).map(([,r])=>r);document.getElementById('progress').textContent=`${records.filter(r=>r.done&&!r.assisted).length} independent · ${records.filter(r=>r.done&&r.assisted).length} assisted / ${chapterIds.size} stages · ${chapter.title}`;
 document.getElementById('scope').textContent=chapter.scopeNote;
 view.innerHTML=mode==='learn'?learnView(chapter,assets,lesson,step,{motion:!state.reduced&&!matchMedia('(prefers-reduced-motion: reduce)').matches}):practiceView(chapter,assets,exercise,stage,state,chosen,feedback);
 if(action){const target=view.querySelector(`[data-action="${action}"]:not(:disabled)`);const fallback=view.querySelector(mode==='learn'?'.step':action==='practiceConcept'?'#question':'#feedback');const focus=target||fallback;if(focus){if(!target)focus.tabIndex=-1;focus.focus({preventScroll:true});}}
}
function download(name,content,type){const url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}
document.addEventListener('click',async event=>{const b=event.target.closest('button,[data-explore-part],[data-select-part]');if(!b||b.disabled)return;
 if(b.dataset.explorePart){const next=chapter.lessons[lesson].steps.findIndex(s=>s.focus.includes(b.dataset.explorePart));if(next>=0){step=next;render();const part=view.querySelector(`[data-explore-part="${b.dataset.explorePart}"]`);part?.focus({preventScroll:true});}return;}
 if(b.dataset.action==='playVisual'||b.dataset.action==='replayVisual'){const figure=b.closest('.biochemistry-figure');if(state.reduced||matchMedia('(prefers-reduced-motion: reduce)').matches)return;if(b.dataset.action==='replayVisual'){figure.dataset.playing='true';void figure.offsetWidth;figure.getAnimations({subtree:true}).forEach(animation=>{animation.currentTime=0;});}else figure.dataset.playing=figure.dataset.playing==='true'?'false':'true';const control=figure.querySelector('[data-action=playVisual]');control.textContent=figure.dataset.playing==='true'?'Pause process':'Play process';control.setAttribute('aria-pressed',figure.dataset.playing);return;}
 if(b.dataset.mode){mode=b.dataset.mode;feedback='';chosen=[];}
 else if(b.dataset.lesson!==undefined){lesson=Number(b.dataset.lesson);step=0;}
 else if(b.dataset.exercise!==undefined){exercise=Number(b.dataset.exercise);stage=0;chosen=[];feedback='';}
 else if(b.dataset.node||b.dataset.selectPart){const id=b.dataset.node||b.dataset.selectPart;chosen=chosen.includes(id)?chosen.filter(n=>n!==id):[...chosen,id];const pressed=chosen.includes(id);b.setAttribute('aria-pressed',pressed);view.querySelectorAll('[data-node],[data-select-part]').forEach(el=>el.setAttribute('aria-pressed',chosen.includes(el.dataset.node||el.dataset.selectPart)));view.querySelectorAll('.entity').forEach((g,i)=>g.classList.toggle('selected',chosen.includes(assets[current().s.asset||current().ex.asset].nodes[i].id)));return;}
 else {const action=b.dataset.action;
 if(action==='practiceConcept'){const target=chapter.exercises.findIndex(ex=>ex.asset===chapter.lessons[lesson].asset);if(target<0)return;mode='practice';exercise=target;stage=0;chosen=[];feedback='';}
 else if(action==='next')step++;else if(action==='previous')step--;
 else if(action==='theme'){state.theme=state.theme==='dark'?'light':'dark';save();}
 else if(action==='motion'){state.reduced=!state.reduced;save();}
 else if(action==='hint'||action==='reveal'){const {key}=current(),r=state.stages[key]||{done:false,assisted:false,hints:0};r.assisted=true;if(action==='hint')r.hints=Math.min(r.hints+1,2);else r.done=true;state.stages[key]=r;save();}
 else if(action==='advance'){if(stage+1<current().ex.stages.length)stage++;else{const ex=current().ex;ex.stages.forEach(s=>delete state.stages[stageKey(ex,s)]);stage=0;save();}chosen=[];feedback='';}
 else if(action==='export'){download('biochemistry-progress.json',JSON.stringify(state,null,2),'application/json');return;}
 else if(action==='reset'){if(!confirm('Reset all Biochemistry progress and preferences?'))return;state=fresh();stage=0;chosen=[];feedback='';save();}
 else if(action==='save-app'){try{let html;if(location.protocol==='file:'){const root=document.documentElement.cloneNode(true);root.querySelector('#view').innerHTML='';html='<!doctype html>\n'+root.outerHTML;}else{const r=await fetch('Biochemistry-Field-Notes-offline.html');if(!r.ok)throw Error();html=await r.text();}download('Biochemistry-Field-Notes-offline.html',html,'text/html');}catch{warning='Download unavailable. Use the standalone HTML supplied with this build.';} }
 else return;}
 render();
});
document.addEventListener('submit',event=>{if(event.target.id!=='answer-form')return;event.preventDefault();const {s,key}=current(),form=event.target;
 const value=s.type==='selection'?chosen:s.type==='choice'?(form.querySelector(':checked')?Number(form.querySelector(':checked').value):null):form.elements.answer.value;
 if(validateAnswer(s,value)){state.stages[key]={done:true,assisted:state.stages[key]?.assisted===true,hints:state.stages[key]?.hints||0};save();feedback='';}else feedback='Not correct yet. Reconsider the mechanism, or use a hint.';render();const message=document.getElementById('feedback');message.tabIndex=-1;message.focus({preventScroll:true});
});
document.getElementById('import').addEventListener('change',async event=>{const file=event.target.files[0];if(!file)return;try{if(file.size>200000)throw Error('Progress file exceeds 200 KB.');state=sanitize(JSON.parse(await file.text()),ids);stage=0;chosen=[];feedback='';save();warning='Progress imported.';}catch(error){warning='Import rejected: '+error.message;}event.target.value='';render();});
document.getElementById('catalog').addEventListener('change',event=>{const next=data.chapters.find(c=>c.id===event.target.value);if(!next)return;chapter=next;lesson=0;step=0;exercise=0;stage=0;chosen=[];feedback='';render();view.focus({preventScroll:true});});
document.getElementById('catalog').innerHTML=data.catalog.chapters.map(c=>`<option value="${c.id}" ${c.status==='planned'?'disabled':''}>${c.number}. ${e(c.title)}${c.status==='planned'?' — planned':c.status==='pilot'?' — pilot':''}</option>`).join('');
render();

document.addEventListener('keydown',event=>{if((event.key==='Enter'||event.key===' ')&&event.target.matches('[data-explore-part],[data-select-part]')){event.preventDefault();event.target.dispatchEvent(new MouseEvent('click',{bubbles:true}));}});

return {};})();
})();</script></body></html>
